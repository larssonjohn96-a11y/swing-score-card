name: Simplify bunker match
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-bunker-match.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch bunker flows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Friend/team match
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          s = s.replace('function generateChallenge(category: MatchCategory, typeId: string, mode: MatchMode, shortGameLies: ShortGameLie[] = ["fairway", "rough", "bunker"], approachDistance?: number): Challenge {', 'function generateChallenge(category: MatchCategory, typeId: string, mode: MatchMode, shortGameLies: ShortGameLie[] = ["fairway", "rough"], approachDistance?: number): Challenge {')
          s = s.replace('  { points: 1, label: "På green" },\n  { points: 0, label: "Missad green" },', '  { points: 1, label: "På green · utanför 3 m" },\n  { points: 0, label: "Missad green" },')
          s = s.replace('  if (category === "around-the-green" || category === "bunker") {\n    const distance = approachDistance ?? rand(8, 30);\n    const band = getChipDistanceBand(distance);\n    return { eyebrow: category === "bunker" ? "Bunker • Match" : band.label, title: `${distance} m`, detail: category === "bunker" ? `Samma bunkerläge · närmast flaggan vinner${suffix}` : `${distance} m från flaggan · närmast flaggan vinner${suffix}` };\n  }', '  if (category === "bunker") {\n    return { eyebrow: "Bunker", title: "Bunkerslag", detail: `Närmast flaggan vinner${suffix}` };\n  }\n  if (category === "around-the-green") {\n    const distance = approachDistance ?? rand(8, 30);\n    const band = getChipDistanceBand(distance);\n    return { eyebrow: band.label, title: `${distance} m`, detail: `${distance} m från flaggan · närmast flaggan vinner${suffix}` };\n  }')
          s = s.replace('      : isShortGameScoring\n      ? generateChipMatchDistances(matchLength).map((distance) => ({ challenge: generateChallenge(category, matchType, mode, shortGameLies, distance), winner: null as HoleWinner }))', '      : isBunker\n      ? Array.from({ length: matchLength }, (_, index) => ({ challenge: { eyebrow: "Bunker", title: `Bunkerslag ${index + 1}`, detail: `Närmast flaggan vinner` }, winner: null as HoleWinner }))\n      : isShortGame\n      ? generateChipMatchDistances(matchLength).map((distance) => ({ challenge: generateChallenge(category, matchType, mode, shortGameLies, distance), winner: null as HoleWinner }))')
          s = s.replace('    if (category !== "putting" && category !== "around-the-green" && category !== "bunker") return next;', '    if (category !== "putting" && category !== "around-the-green") return next;')
          p.write_text(s)

          # Bot match
          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()
          s = s.replace('  { points: 1, label: "På green" },\n  { points: 0, label: "Missad green" },', '  { points: 1, label: "På green · utanför 3 m" },\n  { points: 0, label: "Missad green" },')
          s = s.replace('    const chipDistances = category === "around-the-green" || category === "bunker" ? generateChipMatchDistances(length) : [];', '    const chipDistances = category === "around-the-green" ? generateChipMatchDistances(length) : [];')
          s = s.replace('      if (category === "around-the-green" || category === "bunker") {\n        const d = chipDistances[holeNr] ?? 15;\n        return { title: `${d} m`, distance: d, detail: category === "bunker" ? "Bunkerslag · närmast flaggan vinner." : "Närmast flaggan vinner." };\n      }', '      if (category === "bunker") {\n        return { title: `Bunkerslag ${holeNr + 1}`, detail: "Närmast flaggan vinner." };\n      }\n      if (category === "around-the-green") {\n        const d = chipDistances[holeNr] ?? 15;\n        return { title: `${d} m`, distance: d, detail: "Närmast flaggan vinner." };\n      }')
          # Keep bunker simulation internal, but never adapt/show a meter distance after a bunker result.
          s = s.replace('    const engineSkill = category === "putting" ? "putting" : category === "around-the-green" || category === "bunker" ? "chip" : null;', '    const engineSkill = category === "putting" ? "putting" : category === "around-the-green" ? "chip" : null;')
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git commit -m "Simplify bunker match to numbered shots"
          git push
