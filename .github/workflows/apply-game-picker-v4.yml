name: Apply game picker v4

on:
  push:
    paths:
      - scripts/patch-game-picker-v4.py
      - .github/workflows/apply-game-picker-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-game-picker-v4.py
      - name: Commit changes and clean patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git rm scripts/patch-game-picker-v4.py .github/workflows/apply-game-picker-v4.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restructure match picker around actual games"
          git push origin HEAD:main
