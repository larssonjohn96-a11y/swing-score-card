name: Improve Learn quiz readability and coach hints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-learn-quiz-readability-coach.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Improve quiz typography and coach hints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/learn.tsx')
          s=p.read_text()

          s=s.replace('''  const [lessonVisible, setLessonVisible] = useState(false);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);''','''  const [lessonVisible, setLessonVisible] = useState(false);\n  const [coachHintOpen, setCoachHintOpen] = useState(false);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);''')

          s=s.replace('''    setLessonVisible(false);\n    openSessionHistory();\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });''','''    setLessonVisible(false);\n    setCoachHintOpen(false);\n    openSessionHistory();\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });''')
          s=s.replace('''    setLessonVisible(false);\n    openSessionHistory();\n    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });''','''    setLessonVisible(false);\n    setCoachHintOpen(false);\n    openSessionHistory();\n    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });''')

          s=s.replace('''      setSession({ ...session, index: nextIndex, selected: undefined });\n      return;''','''      setCoachHintOpen(false);\n      setSession({ ...session, index: nextIndex, selected: undefined });\n      return;''')

          old='''                <p className="text-[10px] font-black uppercase tracking-[.18em] text-white/40">{question.level === "recall" ? "Kom ihåg" : question.level === "understand" ? "Förstå" : "Använd"}</p>\n                <h2 className="mt-3 font-display text-[30px] leading-[1.08]">{question.prompt}</h2>\n                <p className="mt-3 text-sm text-white/45">Välj det svar som passar bäst.</p>'''
          new='''                <p className="text-xs font-semibold text-white/45">{question.level === "recall" ? "Kom ihåg" : question.level === "understand" ? "Förstå" : "Använd i spelet"}</p>\n                <h2 className="mt-2 font-sans text-[26px] font-semibold normal-case leading-[1.18] tracking-[-0.02em] text-white">{question.prompt}</h2>\n                <p className="mt-3 text-sm leading-relaxed text-white/45">Välj det svar som passar bäst.</p>'''
          if old not in s: raise SystemExit('question heading block not found')
          s=s.replace(old,new)

          marker='''                {answered ? <div className={`mt-5 rounded-[22px] border p-4 ${session.selected === question.correct ? "border-emerald-300/25 bg-emerald-400/[.08]" : "border-amber-300/25 bg-amber-300/[.07]"}`}><p className="text-sm leading-relaxed text-white/78">{question.feedback}</p></div> : null}\n                <div className="mt-auto pt-6">'''
          replacement='''                {answered ? <div className={`mt-5 rounded-[22px] border p-4 ${session.selected === question.correct ? "border-emerald-300/25 bg-emerald-400/[.08]" : "border-amber-300/25 bg-amber-300/[.07]"}`}><p className="text-sm leading-relaxed text-white/78">{question.feedback}</p></div> : null}\n\n                {!answered ? <div className="fixed bottom-[max(22px,env(safe-area-inset-bottom))] right-4 z-[120] flex flex-col items-end gap-2">\n                  {coachHintOpen ? <div className="max-w-[280px] rounded-[22px] border border-emerald-300/20 bg-[#303536]/98 p-4 shadow-[0_18px_50px_-20px_rgba(0,0,0,.9)] backdrop-blur-2xl">\n                    <p className="text-xs font-bold text-emerald-300">Coachens tips</p>\n                    <p className="mt-1.5 text-sm leading-relaxed text-white/80">{question.level === "recall" ? `Tänk tillbaka på kärnan i ${selected.title}. Fokusera på vad begreppet betyder.` : question.level === "understand" ? "Fråga dig vilket svar som bäst förklarar varför principen påverkar slaget eller scoren." : "Tänk som på banan: välj lösningen med bäst marginal och minst onödig risk."}</p>\n                  </div> : null}\n                  <button type="button" onClick={() => setCoachHintOpen((open) => !open)} aria-label="Visa coachens tips" className="flex h-14 w-14 items-center justify-center rounded-full border border-emerald-300/30 bg-[#303536] shadow-[0_12px_34px_-14px_rgba(0,0,0,.9)] active:scale-[.96]"><span className="text-2xl">🧑🏻‍🏫</span></button>\n                </div> : null}\n\n                <div className="mt-auto pt-6">'''
          if marker not in s: raise SystemExit('feedback marker not found')
          s=s.replace(marker,replacement)

          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/learn.tsx
          git commit -m "Improve Learn quiz readability and add coach hints"
          git push
