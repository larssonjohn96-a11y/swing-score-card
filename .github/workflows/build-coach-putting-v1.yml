          Path('src/lib/coach-putting.ts').write_text(r'''import { loadPlayerEngineModel, puttingPerformanceFromStrokes, recordEngineOutcome } from "@/lib/sg4-engine";

export type CoachId = "alma" | "axel" | "leo";
export type CoachPuttingShot = {
  id: string;
  sessionId: string;
  playedAt: string;
  distance: number;
  strokes: 1 | 2 | 3 | 4;
  source: "coach";
};

export type CoachKnowledgeEvent = {
  id: string;
  playedAt: string;
  topic: string;
  kind: "shown" | "answered";
  correct?: boolean;
};

const SHOTS_KEY = "sg4-coach-putting-shots-v1";
const KNOWLEDGE_KEY = "sg4-coach-knowledge-events-v1";
const COACH_KEY = "sg4-selected-coach-v1";

export const COACHES = [
  { id: "alma" as const, name: "Alma", style: "Lugn PGA-coach", emoji: "👩🏻‍🏫", description: "Tydlig, varm och selektiv. Säger något när det faktiskt hjälper." },
  { id: "axel" as const, name: "Axel", style: "Rak & krävande", emoji: "🧑🏼‍🏫", description: "Kort, konkret och mer direkt när samma misstag upprepas." },
  { id: "leo" as const, name: "Leo", style: "Peppande coach", emoji: "👨🏽‍🏫", description: "Mer energi och beröm, men samma spelmotor och samma krav." },
] as const;

function read<T>(key: string, fallback: T): T {
  if (typeof window === "undefined") return fallback;
  try { return JSON.parse(window.localStorage.getItem(key) || "null") ?? fallback; } catch { return fallback; }
}
function write(key: string, value: unknown) { if (typeof window !== "undefined") window.localStorage.setItem(key, JSON.stringify(value)); }

export function loadCoachPuttingShots(): CoachPuttingShot[] { return read<CoachPuttingShot[]>(SHOTS_KEY, []); }
export function loadCoachKnowledgeEvents(): CoachKnowledgeEvent[] { return read<CoachKnowledgeEvent[]>(KNOWLEDGE_KEY, []); }
export function loadSelectedCoach(): CoachId { const id = read<CoachId>(COACH_KEY, "alma"); return COACHES.some(c => c.id === id) ? id : "alma"; }
export function saveSelectedCoach(id: CoachId) { write(COACH_KEY, id); }

export function recordCoachPuttingShot(sessionId: string, distance: number, strokes: 1 | 2 | 3 | 4) {
  const shot: CoachPuttingShot = { id: crypto.randomUUID(), sessionId, playedAt: new Date().toISOString(), distance, strokes, source: "coach" };
  write(SHOTS_KEY, [...loadCoachPuttingShots(), shot]);
  recordEngineOutcome({ skill: "putting", distance, performance: puttingPerformanceFromStrokes(strokes), context: "game", activityId: "coach-putting" });
  window.dispatchEvent(new Event("sg4-sessions-changed"));
  return shot;
}

export function recordCoachKnowledge(topic: string, kind: "shown" | "answered", correct?: boolean) {
  const event: CoachKnowledgeEvent = { id: crypto.randomUUID(), playedAt: new Date().toISOString(), topic, kind, ...(kind === "answered" ? { correct: Boolean(correct) } : {}) };
  write(KNOWLEDGE_KEY, [...loadCoachKnowledgeEvents(), event].slice(-1000));
}

function bucket(distance: number) {
  if (distance <= 2) return "0-2";
  if (distance <= 5) return "3-5";
  if (distance <= 8) return "6-8";
  if (distance <= 14) return "9-14";
  return "15+";
}

const BUCKETS = [
  { id: "0-2", min: 1, max: 2, base: 0.34 },
  { id: "3-5", min: 3, max: 5, base: 0.26 },
  { id: "6-8", min: 6, max: 8, base: 0.16 },
  { id: "9-14", min: 9, max: 14, base: 0.15 },
  { id: "15+", min: 15, max: 22, base: 0.09 },
] as const;

function recentBucketPerformance(id: string) {
  const shots = loadCoachPuttingShots().filter(s => bucket(s.distance) === id).slice(-20);
  if (!shots.length) return null;
  return shots.reduce((sum, s) => sum + puttingPerformanceFromStrokes(s.strokes), 0) / shots.length;
}

export function nextCoachPuttingDistance(previous?: number) {
  const engine = loadPlayerEngineModel();
  const scored = BUCKETS.map(b => {
    const engineBucket = engine.buckets[`putting:${b.id}`];
    const localPerf = recentBucketPerformance(b.id);
    const performance = localPerf ?? engineBucket?.performance ?? 0.7;
    const confidence = engineBucket?.confidence ?? (localPerf === null ? 0 : 0.35);
    const weaknessBoost = (1 - performance) * (0.20 + confidence * 0.12);
    let weight = b.base * (1 + weaknessBoost);
    if (previous !== undefined && bucket(previous) === b.id) weight *= 0.42;
    return { ...b, weight };
  });
  const total = scored.reduce((s, b) => s + b.weight, 0);
  let roll = Math.random() * total;
  let chosen = scored[0];
  for (const b of scored) { roll -= b.weight; if (roll <= 0) { chosen = b; break; } }
  let d = Math.floor(Math.random() * (chosen.max - chosen.min + 1)) + chosen.min;
  if (previous !== undefined) {
    let tries = 0;
    while ((d === previous || Math.abs(d - previous) < 2) && tries < 12) { d = Math.floor(Math.random() * (chosen.max - chosen.min + 1)) + chosen.min; tries++; }
  }
  return d;
}

const LIBRARY = [
  { id: "lag-goal", topic: "lag-putting", when: (d:number,s:number)=>d>=10 && s>=3, text: "På långa puttar är den stora vinsten att eliminera treputtar. Prioritera fart och lämna nästa putt enkel." },
  { id: "lag-speed", topic: "lag-putting", when: (d:number,s:number)=>d>=10 && s<=2, text: "Bra. På den här längden är tvåputt ett starkt resultat. Det tyder ofta på att farten varit tillräckligt bra för att hålla nästa putt enkel." },
  { id: "short-start", topic: "start-line", when: (d:number,s:number)=>d<=2 && s>=2, text: "På kortputt blir startlinjen extra viktig. Bestäm linjen före stroken och försök starta bollen exakt där – inte att styra den efter träffen." },
  { id: "short-good", topic: "short-putting", when: (d:number,s:number)=>d<=2 && s===1, text: "Satt. På kortputtar bygger du scoring genom att göra det enkla repeterbart: tydlig linje, stabil rutin, samma commitment." },
  { id: "mid-pace", topic: "pace", when: (d:number,s:number)=>d>=4 && d<=8 && s>=3, text: "Från mellanlängd kostar dålig fart snabbt ett extra slag. Tänk slutposition först: vilken fart lämnar den enklaste nästa putten?" },
  { id: "capture-speed", topic: "capture-speed", when: (d:number,s:number)=>d>=3 && d<=7 && s===1, text: "Bra satt. En viktig puttingprincip är att linjen och farten hör ihop: mer fart gör den effektiva breaken mindre, mindre fart gör den större." },
  { id: "eyes-quiet", topic: "routine", when: (d:number,s:number)=>d<=5 && s>=2, text: "Ett enkelt sätt att förbättra kortputt är att göra blicken lugn. Läs, välj startpunkt och låt sedan stroken ske utan en sista korrigering." },
  { id: "commit", topic: "commitment", when: (_d:number,s:number)=>s>=3, text: "När ett resultat blir dyrt: ändra inte tre saker samtidigt. Välj en enda sak till nästa putt – linje, fart eller rutin – och gör den tydligt." },
  { id: "random-practice", topic: "transfer", when: (d:number,_s:number)=>d>=6, text: "Vi varierar längderna medvetet. På banan får du sällan samma putt två gånger, så variation tränar avståndskänslan bättre för spel än blockrepetition." },
  { id: "read-first", topic: "green-reading", when: (d:number,_s:number)=>d>=5 && d<=12, text: "Bra greenläsning börjar innan du ställer upp. Bedöm först fallinje och övergripande lutning, välj sedan startlinje och fart." },
  { id: "long-target", topic: "external-focus", when: (d:number,_s:number)=>d>=12, text: "På långputt kan ett yttre fokus hjälpa: tänk mer på var bollen ska stanna än på hur putterrörelsen ska se ut." },
  { id: "dispersion", topic: "dispersion", when: (d:number,_s:number)=>d>=8, text: "En enskild putt säger lite. Det viktiga är mönstret över många försök – därför tittar coachen mer på din spridning per längd än på ett enskilt resultat." },
] as const;

function topicExposure(topic: string) { return loadCoachKnowledgeEvents().filter(e => e.topic === topic && e.kind === "shown").length; }

export function coachComment(distance: number, strokes: number, coachId: CoachId, shotNumber: number) {
  if (shotNumber < 2) return null;
  const eligible = LIBRARY.filter(item => item.when(distance, strokes)).sort((a,b)=>topicExposure(a.topic)-topicExposure(b.topic));
  if (!eligible.length) return strokes === 1 && shotNumber % 4 === 0 ? praise(coachId) : null;
  const fresh = eligible.filter(item => topicExposure(item.topic) < 3);
  const item = (fresh.length ? fresh : eligible)[Math.floor(Math.random() * Math.min(3, (fresh.length ? fresh : eligible).length))];
  if (shotNumber % 3 !== 0 && strokes === 2) return null;
  recordCoachKnowledge(item.topic, "shown");
  const prefix = coachId === "axel" ? "" : coachId === "leo" ? "Bra att veta: " : "Coachens tanke: ";
  return prefix + item.text;
}

function praise(id: CoachId) {
  if (id === "axel") return "Bra. Gör samma sak igen när nästa chans kommer.";
  if (id === "leo") return "Snyggt! Det där är precis den typ av putt som bygger självförtroende på banan.";
  return "Bra spelat. Stabilt resultat – behåll samma lugna rutin.";
}

export function maybeCoachQuestion(distance: number, shotNumber: number) {
  if (shotNumber < 5 || shotNumber % 7 !== 0) return null;
  if (distance >= 10) return { topic: "lag-putting", prompt: "Vad är huvudmålet från den här längden?", options: ["Försöka håla till varje pris", "Lämna en enkel andraputt"], correct: 1, feedback: "Rätt fokus är att minimera treputt. Hålar du är det bonus." };
  if (distance <= 2) return { topic: "start-line", prompt: "Vad blir extra viktigt på en kortputt?", options: ["Startlinjen", "Maximal fart"], correct: 0, feedback: "På kortputt blir små fel i startlinjen snabbt avgörande." };
  return null;
}

export function coachPuttingSummary(shots: CoachPuttingShot[]) {
  if (!shots.length) return { count: 0, onePuttPct: 0, threePuttPct: 0, avg: 0 };
  const one = shots.filter(s => s.strokes === 1).length;
  const three = shots.filter(s => s.strokes >= 3).length;
  return { count: shots.length, onePuttPct: Math.round(one / shots.length * 100), threePuttPct: Math.round(three / shots.length * 100), avg: Math.round(shots.reduce((a,s)=>a+s.strokes,0)/shots.length*100)/100 };
}

export function coachPuttingCategoryPoint() {
  const shots = loadCoachPuttingShots();
  if (shots.length < 12) return null;
  const defs = [
    { id:"0-2", w:.35 }, { id:"3-5", w:.25 }, { id:"6-8", w:.15 }, { id:"9-14", w:.15 }, { id:"15+", w:.10 },
  ];
  let weighted = 0, used = 0;
  for (const d of defs) {
    const rows = shots.filter(s => bucket(s.distance) === d.id).slice(-30);
    if (!rows.length) continue;
    const perf = rows.reduce((a,s)=>a+puttingPerformanceFromStrokes(s.strokes),0)/rows.length;
    weighted += perf * d.w; used += d.w;
  }
  if (used < .55) return null;
  const score = Math.round(weighted / used * 100);
  const handicap = Math.max(-4, Math.min(36, 30 - score * .34));
  return { date: shots.at(-1)!.playedAt, handicap, score };
}
''')

