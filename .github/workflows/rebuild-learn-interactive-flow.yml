name: Rebuild Learn interactive lesson flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-learn-interactive-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch Learn
        run: python3 .github/scripts/patch_learn_interactive.py
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/learn.tsx
          git commit -m "Make Learn lessons coach-led and fix back flow"
          git push
