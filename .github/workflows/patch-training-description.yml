name: Patch training description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add training description patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update training description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/bottom-nav.tsx')
          s = p.read_text()
          old = 'Välj träningsområde, slå PB och följ din utveckling över tid.'
          new = 'Träna själv eller tillsammans med en kompis, slå PB och följ din utveckling över tid.'
          if old not in s:
              raise SystemExit('training description not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/bottom-nav.tsx
          git commit -m "Mention solo and friend training in quick menu"
          git push