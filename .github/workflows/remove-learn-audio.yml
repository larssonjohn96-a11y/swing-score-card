name: Remove Learn audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-learn-audio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Remove audio from Learn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/learn.tsx')
          s=p.read_text()
          s=s.replace('  Volume2,\n', '').replace('  VolumeX,\n', '')
          s=s.replace('  const [soundOn, setSoundOn] = useState(true);\n', '')
          s=re.sub(r'\n  function speakCoach\(text: string\) \{.*?\n  \}, \[scoreStep, lessonVisible, session\?\.mode, selectedId, soundOn\]\);\n', '\n', s, flags=re.S)
          s=re.sub(r'\n\s*<button type="button" onClick=\{\(\) => setSoundOn\(\(v\) => !v\)\}.*?</button>', '', s, count=1, flags=re.S)
          s=re.sub(r'\n\s*<button type="button" onClick=\{\(\) => speakCoach\(SCORE_LESSON_STEPS\[scoreStep\]\.coach\)\}.*?</button>', '', s, count=1, flags=re.S)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/learn.tsx
          git commit -m "Remove audio from Learn lessons" || exit 0
          git push