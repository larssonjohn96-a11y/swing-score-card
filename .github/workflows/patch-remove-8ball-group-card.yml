name: Remove separate 8-ball group card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary 8-ball card cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch training page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/traning.tsx')
          s = p.read_text()
          s = s.replace('import { ArrowLeft, ChevronRight, Crosshair, Grid3x3, Users } from "lucide-react";', 'import { ArrowLeft, ChevronRight, Crosshair, Grid3x3 } from "lucide-react";')
          start = s.find('          {category === "around-the-green" ? (\n            <a href="/8-bollar-grupp"')
          if start == -1:
              raise SystemExit('8-ball group card block not found')
          end_marker = '          ) : null}\n'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('8-ball group card block end not found')
          end += len(end_marker)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/traning.tsx
          git commit -m "Remove separate 8-ball group card"
          git push
