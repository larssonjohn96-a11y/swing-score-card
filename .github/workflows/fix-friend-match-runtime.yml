name: Fix friend match runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-friend-match-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch SSR-unsafe match entry flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          old = '  const [entryFlow] = useState<"friend" | "team">(() => new URLSearchParams(window.location.search).get("flow") === "team" ? "team" : "friend");\n'
          new = '  const [entryFlow] = useState<"friend" | "team">(() => {\n    if (typeof window === "undefined") return "friend";\n    return new URLSearchParams(window.location.search).get("flow") === "team" ? "team" : "friend";\n  });\n'
          if old in s:
              p.write_text(s.replace(old, new))
          elif 'if (typeof window === "undefined") return "friend";' not in s:
              raise SystemExit('entryFlow block not found')
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Verify SSR guard
        run: |
          grep -Fq 'if (typeof window === "undefined") return "friend";' src/routes/match.tsx
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/routes/match.tsx').read_text()
          unsafe = 'useState<"friend" | "team">(() => new URLSearchParams(window.location.search)'
          if unsafe in s:
              raise SystemExit('unguarded window.location initializer still present')
          print('SSR guard verified')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Fix friend match SSR crash" || exit 0
          git push
