name: Refine quick menu cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary quick menu patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update quick menu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/bottom-nav.tsx')
          s = p.read_text()

          s = s.replace(
              '{ to: "/match", label: "Tävla", description: "Tävla i Singles, Fourball eller Foursomes.", icon: Users, tone: "h2h" },',
              '{ to: "/match", label: "Match", description: "Spela Singles eller lagmatch i Fourball och Foursomes.", icon: Users, tone: "h2h" },'
          )

          s = s.replace(
              '<SheetContent side="bottom" className="rounded-t-3xl px-5 pb-5 pt-5">',
              '<SheetContent side="bottom" className="rounded-t-[32px] px-5 pb-7 pt-6">',
              1
          )
          s = s.replace(
              '<SheetHeader className="space-y-1"><SheetTitle className="text-left text-2xl">Vad vill du göra?</SheetTitle><p className="text-left text-xs text-muted-foreground">Välj mellan att testa, träna eller tävla.</p></SheetHeader>',
              '<SheetHeader className="space-y-1.5"><SheetTitle className="text-left text-[28px] leading-none">Vad vill du göra?</SheetTitle><p className="text-left text-sm text-muted-foreground">Välj mellan att testa, träna eller spela match.</p></SheetHeader>'
          )
          s = s.replace('<div className="mt-4 space-y-2">\n              <button type="button" onClick={() => setQuickView("hcp")}', '<div className="mt-5 space-y-3">\n              <button type="button" onClick={() => setQuickView("hcp")}', 1)

          s = s.replace(
              'className="group flex w-full items-center gap-3 rounded-2xl border border-primary/25 bg-primary/[0.045] px-4 py-4 text-left transition-colors hover:border-primary/40 hover:bg-primary/[0.07]"',
              'className="group flex min-h-[92px] w-full items-center gap-4 rounded-3xl border border-primary/25 bg-primary/[0.045] px-5 py-5 text-left transition-colors hover:border-primary/40 hover:bg-primary/[0.07]"'
          )
          s = s.replace(
              '<span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-tint-strong text-primary"><Target className="h-5 w-5" /></span>',
              '<span className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-tint-strong text-primary"><Target className="h-6 w-6" /></span>'
          )
          s = s.replace(
              '<h3 className="text-lg font-semibold leading-none">Handicap-test</h3>',
              '<h3 className="text-xl font-semibold leading-none">Handicap-test</h3>'
          )
          s = s.replace(
              '<p className="mt-1 text-[11px] leading-snug text-muted-foreground">Gör ett test och få ett handicapresultat i kategorin.</p>',
              '<p className="mt-2 text-sm leading-snug text-muted-foreground">Testa din nivå och få ett handicapresultat i vald kategori.</p>'
          )

          s = s.replace(
              'className="group flex items-center gap-3 rounded-2xl border border-border bg-muted/55 px-4 py-4 transition-colors hover:border-primary hover:bg-muted/70"',
              'className="group flex min-h-[92px] items-center gap-4 rounded-3xl border border-border bg-muted/55 px-5 py-5 transition-colors hover:border-primary hover:bg-muted/70"'
          )
          s = s.replace(
              '<span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-border bg-background/80 text-foreground"><ListChecks className="h-5 w-5" /></span>',
              '<span className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl border border-border bg-background/80 text-foreground"><ListChecks className="h-6 w-6" /></span>'
          )
          s = s.replace(
              '<h3 className="text-lg font-semibold leading-none">Träning</h3>',
              '<h3 className="text-xl font-semibold leading-none">Träning</h3>'
          )
          s = s.replace(
              '<p className="mt-1 text-[11px] leading-snug text-muted-foreground">Träna specifika färdigheter och följ din utveckling.</p>',
              '<p className="mt-2 text-sm leading-snug text-muted-foreground">Välj träningsområde, slå PB och följ din utveckling över tid.</p>'
          )

          s = s.replace(
              'className="group flex items-center gap-3 rounded-2xl border border-blue-500/20 bg-gradient-to-r from-blue-500/[0.06] via-card to-red-500/[0.06] px-4 py-4 transition-colors hover:border-red-500/30"',
              'className="group flex min-h-[92px] items-center gap-4 rounded-3xl border border-blue-500/20 bg-gradient-to-r from-blue-500/[0.06] via-card to-red-500/[0.06] px-5 py-5 transition-colors hover:border-red-500/30"'
          )
          s = s.replace(
              '<span className="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white/85 shadow-sm">',
              '<span className="relative flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl border border-slate-200 bg-white/85 shadow-sm">'
          )
          s = s.replace('left-1 h-[18px] w-[18px]', 'left-1.5 h-[20px] w-[20px]', 1)
          s = s.replace('right-1 h-[18px] w-[18px]', 'right-1.5 h-[20px] w-[20px]', 1)
          s = s.replace(
              '<h3 className="text-lg font-semibold leading-none">Tävla</h3><span className="rounded-full bg-red-500/[0.08] px-2 py-0.5 text-[9px] font-semibold uppercase tracking-[0.12em] text-red-500">H2H</span>',
              '<h3 className="text-xl font-semibold leading-none">Match</h3><span className="rounded-full bg-slate-900 px-2 py-0.5 text-[9px] font-semibold uppercase tracking-[0.12em] text-white">MATCH</span>'
          )
          s = s.replace(
              '<p className="mt-1 text-[11px] leading-snug text-muted-foreground">Tävla mot din kompis i Singles, Fourball eller Foursomes.</p>',
              '<p className="mt-2 text-sm leading-snug text-muted-foreground">Spela Singles 1 mot 1 eller lagmatch i Fourball och Foursomes.</p>'
          )

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/bottom-nav.tsx
          git commit -m "Enlarge quick menu and rename competition to Match"
          git push
