name: Patch pressure copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch pressure banner copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          old = '''<p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-950">Pressläge · Hål {holeIndex + 1}</p><p className="mt-1 text-[10px] font-bold leading-snug text-slate-800">{pressureNotice}</p><p className="mt-1 text-[9px] font-semibold text-slate-700">{Math.abs(diff)} {Math.abs(diff) === 1 ? "hål" : "hål"} skiljer · {holesRemaining} kvar efter detta</p>'''
          new = '''<p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-950">Pressläge · Nu gäller det</p><p className="mt-1 text-[10px] font-bold leading-snug text-slate-800">{pressureNotice}</p>'''
          if old not in s:
              raise SystemExit('Target pressure banner markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git commit -m "Simplify pressure banner copy"
          git push
