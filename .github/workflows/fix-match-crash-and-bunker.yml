name: Fix match crash and bunker flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-match-crash-and-bunker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch match route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()

          # Remove orphan recommendation effect that references identifiers which are not defined in this route.
          broken = '''  useEffect(() => {\n    if (step !== "result") return;\n    if (playActivityId) recordRecommendationCompletion(playActivityId);\n    if (resultRecommendation) recordRecommendationImpressions([resultRecommendation.id]);\n  }, [step, playActivityId, resultRecommendation?.id]);\n'''
          if broken in s:
              s = s.replace(broken, '')

          # Add Bunker Match as its own match category.
          s = s.replace('type MatchCategory = "off-the-tee" | "approach" | "around-the-green" | "putting";', 'type MatchCategory = "off-the-tee" | "approach" | "around-the-green" | "bunker" | "putting";')
          s = s.replace('  { id: "around-the-green", title: "Chipping • Match", subtitle: "Chippning", description: "Chippingmatch mot samma mål. Närmast hålet vinner." },\n', '  { id: "around-the-green", title: "Chipping • Match", subtitle: "Chippning", description: "Chippingmatch mot samma mål. Närmast hålet vinner." },\n  { id: "bunker", title: "Bunker • Match", subtitle: "Bunker", description: "Samma bunkerläge för båda. Närmast hålet vinner." },\n')
          s = s.replace('  "around-the-green": [\n    { id: "closest", title: "Chipping • Match", description: "Ett slag mot flaggan. Närmast flaggan vinner hålet." },\n  ],\n', '  "around-the-green": [\n    { id: "closest", title: "Chipping • Match", description: "Ett slag mot flaggan. Närmast flaggan vinner hålet." },\n  ],\n  bunker: [\n    { id: "closest", title: "Bunker • Match", description: "Ett bunkerslag mot flaggan. Närmast flaggan vinner hålet." },\n  ],\n')
          s = s.replace('  if (category === "around-the-green") return "chip";\n', '  if (category === "around-the-green" || category === "bunker") return "chip";\n')
          s = s.replace('  if (category === "around-the-green") {\n    const distance = approachDistance ?? rand(8, 30);\n    const band = getChipDistanceBand(distance);\n    return { eyebrow: band.label, title: `${distance} m`, detail: `${distance} m från flaggan · närmast flaggan vinner${suffix}` };\n  }\n', '  if (category === "around-the-green" || category === "bunker") {\n    const distance = approachDistance ?? rand(8, 30);\n    const band = getChipDistanceBand(distance);\n    return { eyebrow: category === "bunker" ? "Bunker • Match" : band.label, title: `${distance} m`, detail: category === "bunker" ? `Samma bunkerläge · närmast flaggan vinner${suffix}` : `${distance} m från flaggan · närmast flaggan vinner${suffix}` };\n  }\n')

          # Bunker uses the same six-level scoring structure as chipping, but the final two outcomes are on/missed green.
          marker = 'const SHORT_GAME_LIES: Array<{ id: ShortGameLie; title: string }> = ['
          if 'BUNKER_POINT_ZONES' not in s:
              insert = '''const BUNKER_POINT_ZONES = [\n  { points: 5, label: "Sänkt" },\n  { points: 4, label: "Inom 1 m" },\n  { points: 3, label: "Inom 2 m" },\n  { points: 2, label: "Inom 3 m" },\n  { points: 1, label: "På green" },\n  { points: 0, label: "Missad green" },\n] as const;\n\n'''
              s = s.replace(marker, insert + marker)

          s = s.replace('  const strokeLeader = category === "around-the-green"\n', '  const strokeLeader = category === "around-the-green" || category === "bunker"\n')
          s = s.replace('    : category === "around-the-green" ? `${score.bluePoints}–${score.redPoints}` : `${score.blueStrokes}–${score.redStrokes}`;\n', '    : category === "around-the-green" || category === "bunker" ? `${score.bluePoints}–${score.redPoints}` : `${score.blueStrokes}–${score.redStrokes}`;\n')
          s = s.replace('    : category === "around-the-green" ? "Poäng" : "Slag";\n', '    : category === "around-the-green" || category === "bunker" ? "Poäng" : "Slag";\n')
          s = s.replace('    : category === "around-the-green"\n      ? pointDiff > 0 ? "blue" : pointDiff < 0 ? "red" : null\n', '    : category === "around-the-green" || category === "bunker"\n      ? pointDiff > 0 ? "blue" : pointDiff < 0 ? "red" : null\n')
          s = s.replace('    : category === "around-the-green"\n      ? `${score.bluePoints}–${score.redPoints}`\n', '    : category === "around-the-green" || category === "bunker"\n      ? `${score.bluePoints}–${score.redPoints}`\n')
          s = s.replace('  const isShortGame = category === "around-the-green";\n', '  const isShortGame = category === "around-the-green";\n  const isBunker = category === "bunker";\n  const isShortGameScoring = isShortGame || isBunker;\n')
          s = s.replace('  const isScoredHole = isPutting || isShortGame;\n', '  const isScoredHole = isPutting || isShortGameScoring;\n')
          s = s.replace('  const unitLabel = isPutting || isShortGame || isApproach ? "Hål" : "Omgång";\n', '  const unitLabel = isPutting || isShortGameScoring || isApproach ? "Hål" : "Omgång";\n')

          s = s.replace('    if (category !== "putting" && category !== "around-the-green") return next;\n', '    if (category !== "putting" && category !== "around-the-green" && category !== "bunker") return next;\n')
          s = s.replace('    const skill = category === "putting" ? "putting" : "chip";\n', '    const skill = category === "putting" ? "putting" : "chip";\n')
          s = s.replace('      min: category === "putting" ? 1 : 8,\n      max: category === "putting" ? 22 : 30,\n', '      min: category === "putting" ? 1 : 8,\n      max: category === "putting" ? 22 : 30,\n')
          s = s.replace('      recordEngineOutcome({ skill: "chip", distance: holeDistance(holes[registered]), performance: selfPerformance, context: "game", activityId: "chip-match" });\n', '      recordEngineOutcome({ skill: "chip", distance: holeDistance(holes[registered]), performance: selfPerformance, context: "game", activityId: isBunker ? "bunker-match" : "chip-match" });\n')
          s = s.replace('    if (isShortGame && (typeof hole?.bluePoints !== "number" || typeof hole?.redPoints !== "number")) return;\n', '    if (isShortGameScoring && (typeof hole?.bluePoints !== "number" || typeof hole?.redPoints !== "number")) return;\n')

          # Generate bunker holes through the same distance/match flow as chipping.
          s = s.replace('      : isShortGame\n      ? generateChipMatchDistances(matchLength).map((distance) => ({ challenge: generateChallenge(category, matchType, mode, shortGameLies, distance), winner: null as HoleWinner }))\n', '      : isShortGameScoring\n      ? generateChipMatchDistances(matchLength).map((distance) => ({ challenge: generateChallenge(category, matchType, mode, shortGameLies, distance), winner: null as HoleWinner }))\n')

          # Route Bunker Match from category straight into the same match-length flow as Chipping Match.
          s = s.replace('        if (category === "around-the-green") { setMatchType("closest"); setMatchLength(5); setStep("length"); return; }\n', '        if (category === "around-the-green" || category === "bunker") { setMatchType("closest"); setMatchLength(5); setStep("length"); return; }\n')
          s = s.replace('    else if (step === "length") setStep(isApproach ? "approach-setup" : category === "off-the-tee" || isPutting || isShortGame ? "category" : "scoring");\n', '    else if (step === "length") setStep(isApproach ? "approach-setup" : category === "off-the-tee" || isPutting || isShortGameScoring ? "category" : "scoring");\n')

          # Use bunker-specific final options in the short-game registration UI.
          s = s.replace('>{CHIP_POINT_ZONES.map((zone) => <button key={zone.points}', '>{(isBunker ? BUNKER_POINT_ZONES : CHIP_POINT_ZONES).map((zone) => <button key={zone.points}')
          s = s.replace('{value === null ? "Välj avstånd" : getChipPointZone(value)?.label}', '{value === null ? (isBunker ? "Välj resultat" : "Välj avstånd") : (isBunker ? BUNKER_POINT_ZONES.find((zone) => zone.points === value)?.label : getChipPointZone(value)?.label)}')
          s = s.replace('<h2 className="font-display text-2xl">Hur nära hålet?</h2>', '<h2 className="font-display text-2xl">{isBunker ? "Var stannade bollen?" : "Hur nära hålet?"}</h2>')

          # Ensure all short-game display/result conditions include bunker.
          s = s.replace('isShortGame ? score.bluePoints', 'isShortGameScoring ? score.bluePoints')
          s = s.replace('isShortGame ? "poäng"', 'isShortGameScoring ? "poäng"')
          s = s.replace('isShortGame ? score.redPoints', 'isShortGameScoring ? score.redPoints')
          s = s.replace('const value = isShortGame ? h.bluePoints', 'const value = isShortGameScoring ? h.bluePoints')
          s = s.replace('typeof value === "number" ? isShortGame ? `${value}p`', 'typeof value === "number" ? isShortGameScoring ? `${value}p`')
          s = s.replace('const value = isShortGame ? h.redPoints', 'const value = isShortGameScoring ? h.redPoints')

          # Top challenge visual treats bunker like chipping.
          s = s.replace('isPutting || isShortGame || isApproach', 'isPutting || isShortGameScoring || isApproach')
          s = s.replace('!isPutting && !isShortGame && !isApproach', '!isPutting && !isShortGameScoring && !isApproach')
          s = s.replace('isPutting || isShortGame ?', 'isPutting || isShortGameScoring ?')
          s = s.replace('isShortGame ? "text-3xl"', 'isShortGameScoring ? "text-3xl"')
          s = s.replace('isShortGame ? "text-4xl"', 'isShortGameScoring ? "text-4xl"')
          s = s.replace('!isShortGame && !isPgaPutting', '!isShortGameScoring && !isPgaPutting')
          s = s.replace(': isShortGame ? <section', ': isShortGameScoring ? <section')
          s = s.replace('isShortGame ? "Välj antal hål"', 'isShortGameScoring ? "Välj antal hål"')

          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
          grep -n "playActivityId\|resultRecommendation\|Bunker • Match\|BUNKER_POINT_ZONES" src/routes/match.tsx || true
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Fix match runtime crash and add bunker match flow"
          git push
