name: Apply putting scale and winner animation

on:
  push:
    paths:
      - scripts/patch-putting-scale-copy.py
      - .github/workflows/apply-putting-scale-winner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-putting-scale-copy.py
      - name: Commit patched app and remove patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git rm scripts/patch-putting-scale-copy.py .github/workflows/apply-putting-scale-winner.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish putting scoring and celebrate every winner"
          git push origin HEAD:main
