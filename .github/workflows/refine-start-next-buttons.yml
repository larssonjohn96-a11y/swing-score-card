name: Refine start and next buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-start-next-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Refine buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/match.tsx')
          s = p.read_text()

          old = 'font-display text-xl text-white'
          new = 'font-display text-[23px] leading-none text-white'
          if old not in s:
              raise SystemExit('ryderNext text size anchor missing')
          s = s.replace(old, new, 1)

          button_pattern = re.compile(r'<button\b[\s\S]*?</button>')
          changed = 0
          def repl(m):
              nonlocal_changed = None
              block = m.group(0)
              if 'Starta' not in block or 'className={ryderNext}' in block:
                  return block
              updated, n = re.subn(r'className=(?:\{[^\n]*?\}|"[^"]*")', 'className={ryderNext}', block, count=1)
              if n:
                  global changed
                  changed += 1
                  return updated
              return block

          s = button_pattern.sub(repl, s)
          if changed == 0:
              raise SystemExit('no Starta button updated')

          p.write_text(s)
          print(f'Updated {changed} Starta button(s)')
          PY
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Unify start and next match buttons" || exit 0
          git push
