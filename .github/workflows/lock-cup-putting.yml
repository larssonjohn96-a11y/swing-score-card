name: Lock cup to putting

"on":
  push:
    paths:
      - .github/workflows/lock-cup-putting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/lock_cup_to_putting.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run src/lib/bot-match-pressure.test.ts src/lib/bot-skill-model.test.ts src/lib/sg4-engine.test.ts src/lib/sg4-recommender.test.ts
      - name: Commit fixed cup format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cup-engine.ts src/routes/cup.tsx src/routes/turneringar.tsx src/routes/match-bot.tsx
          git commit -m "Make Club Cup a fixed 5-hole putting event"
          git push origin main
