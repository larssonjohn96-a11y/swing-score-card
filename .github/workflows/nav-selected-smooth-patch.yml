name: Nav Selected Smooth Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken selected nav and smooth transitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/bottom-nav.tsx')
          s = p.read_text()
          s = s.replace(
            'transition-all duration-200 active:scale-[0.96]',
            'transition-[background-color,border-color,color,box-shadow,transform] duration-300 ease-out active:scale-[0.96]'
          )
          s = s.replace(
            'border border-white/75 bg-background/82 text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.95),0_8px_24px_-15px_rgba(15,23,42,.72)] backdrop-blur-2xl ring-1 ring-black/[0.035]',
            'border border-white/70 bg-black/[0.09] text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.72),0_10px_26px_-15px_rgba(15,23,42,.78)] backdrop-blur-2xl ring-1 ring-black/[0.05] dark:bg-white/[0.12]'
          )
          s = s.replace(
            'className={`h-5 w-5 ${active ? "stroke-[2.35]" : "stroke-[1.9]"}`}',
            'className={`h-5 w-5 transition-[stroke-width,color,transform] duration-300 ease-out ${active ? "scale-[1.04] stroke-[2.35]" : "scale-100 stroke-[1.9]"}`}'
          )
          s = s.replace(
            'className={`text-[10px] uppercase tracking-wide ${active ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}',
            'className={`text-[10px] uppercase tracking-wide transition-colors duration-300 ease-out ${active ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}'
          )
          s = s.replace(
            'className={`h-5 w-5 ${moreActive ? "stroke-[2.35]" : "stroke-[1.9]"}`}',
            'className={`h-5 w-5 transition-[stroke-width,color,transform] duration-300 ease-out ${moreActive ? "scale-[1.04] stroke-[2.35]" : "scale-100 stroke-[1.9]"}`}'
          )
          s = s.replace(
            'className={`text-[10px] uppercase tracking-wide ${moreActive ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}',
            'className={`text-[10px] uppercase tracking-wide transition-colors duration-300 ease-out ${moreActive ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}'
          )
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/components/bottom-nav.tsx
          git diff --cached --quiet || git commit -m "Darken selected nav and smooth transitions"
          git push
