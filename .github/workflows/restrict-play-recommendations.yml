name: Restrict play recommendations

"on":
  push:
    paths:
      - .github/workflows/restrict-play-recommendations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/restrict_play_recommendations.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run src/lib/sg4-recommender.test.ts src/lib/sg4-engine.test.ts
      - name: Commit play-only recommendations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Keep game recommendations inside play context"
          git push origin main
