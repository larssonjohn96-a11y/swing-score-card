name: Separate chip and bunker match
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-chip-bunker-match.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch friend and bot match flows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Friend match: keep Chipping and Bunker fully separate; remove bunker from legacy chipping-lie options.
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          s = s.replace('type ShortGameLie = "fairway" | "rough" | "bunker";', 'type ShortGameLie = "fairway" | "rough";')
          s = s.replace('  { id: "bunker", title: "Bunker" },\n', '')
          s = s.replace('function lieLabel(lie: ShortGameLie) { return lie === "fairway" ? "fairway" : lie === "rough" ? "rough" : "bunker"; }\n', 'function lieLabel(lie: ShortGameLie) { return lie === "fairway" ? "fairway" : "rough"; }\n')
          s = s.replace('function bunkerLimit(length: MatchLength) { return length === 3 ? 1 : length === 5 ? 1 : 2; }\n', '')
          # Simplify old lie sequence so it can never inject bunker into Chipping Match.
          start = s.find('function generateShortGameLieSequence(')
          end = s.find('\n}\n\nfunction generateChallenge', start)
          if start != -1 and end != -1:
              repl = '''function generateShortGameLieSequence(length: MatchLength, selected: ShortGameLie[]) {\n  const lies: ShortGameLie[] = selected.length ? selected : ["fairway"];\n  return Array.from({ length }, () => pick(lies));\n}'''
              s = s[:start] + repl + s[end+2:]
          p.write_text(s)

          # Bot match: add Bunker as its own selectable match, separate from Chipping.
          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()
          s = s.replace('type Category = "off-the-tee" | "approach" | "around-the-green" | "putting";', 'type Category = "off-the-tee" | "approach" | "around-the-green" | "bunker" | "putting";')
          s = s.replace('  { id: "around-the-green", title: "Chipping • Match", sub: "Chippning" },\n  { id: "putting", title: "Putting • Match", sub: "Puttning" },', '  { id: "around-the-green", title: "Chipping • Match", sub: "Chippning" },\n  { id: "bunker", title: "Bunker • Match", sub: "Bunker" },\n  { id: "putting", title: "Putting • Match", sub: "Puttning" },')

          # Bunker-specific point zones.
          marker = 'function rand(min: number, max: number)'
          if 'BOT_BUNKER_POINT_ZONES' not in s:
              zones = '''const BOT_BUNKER_POINT_ZONES = [\n  { points: 5, label: "Sänkt" },\n  { points: 4, label: "Inom 1 m" },\n  { points: 3, label: "Inom 2 m" },\n  { points: 2, label: "Inom 3 m" },\n  { points: 1, label: "På green" },\n  { points: 0, label: "Missad green" },\n] as const;\n\n'''
              s = s.replace(marker, zones + marker)

          # Reuse short-game distance generation for bunker, but keep category identity separate.
          s = s.replace('    const chipDistances = category === "around-the-green" ? generateChipMatchDistances(length) : [];', '    const chipDistances = category === "around-the-green" || category === "bunker" ? generateChipMatchDistances(length) : [];')
          s = s.replace('      if (category === "around-the-green") {\n        const d = chipDistances[holeNr] ?? 15;\n        const band = getChipDistanceBand(d);\n        return { title: `${d} m`, distance: d, detail: "Närmast flaggan vinner." };\n      }', '      if (category === "around-the-green" || category === "bunker") {\n        const d = chipDistances[holeNr] ?? 15;\n        return { title: `${d} m`, distance: d, detail: category === "bunker" ? "Bunkerslag · närmast flaggan vinner." : "Närmast flaggan vinner." };\n      }')
          s = s.replace('    if (category === "around-the-green") {\n      const chipHcp = effectiveCategoryHcp(bot.categoryHcp.chipping, bot.archetype, lateMatch);', '    if (category === "around-the-green" || category === "bunker") {\n      const chipHcp = effectiveCategoryHcp(bot.categoryHcp.chipping, bot.archetype, lateMatch);')
          s = s.replace('    if (category === "around-the-green") return userValue > botValue ? "you" : userValue < botValue ? "bot" : "tie";', '    if (category === "around-the-green" || category === "bunker") return userValue > botValue ? "you" : userValue < botValue ? "bot" : "tie";')
          s = s.replace('    const engineSkill = category === "putting" ? "putting" : category === "around-the-green" ? "chip" : null;', '    const engineSkill = category === "putting" ? "putting" : category === "around-the-green" || category === "bunker" ? "chip" : null;')
          s = s.replace('      : category === "around-the-green"\n        ? chipPerformanceFromPoints(lockedYourValue)', '      : category === "around-the-green" || category === "bunker"\n        ? chipPerformanceFromPoints(lockedYourValue)')
          s = s.replace('    const playerBad = (category === "putting" && lockedYourValue >= 3) || (category === "around-the-green" && lockedYourValue <= 1)', '    const playerBad = (category === "putting" && lockedYourValue >= 3) || ((category === "around-the-green" || category === "bunker") && lockedYourValue <= 1)')
          s = s.replace('    const botBad = (category === "putting" && simulated.value >= 3) || (category === "around-the-green" && simulated.value <= 1)', '    const botBad = (category === "putting" && simulated.value >= 3) || ((category === "around-the-green" || category === "bunker") && simulated.value <= 1)')
          s = s.replace('    if (category === "around-the-green") {\n      if (side === "bot" && hole.botResultText) return hole.botResultText;\n      return typeof value === "number" ? CHIP_POINT_ZONES.find((zone) => zone.points === value)?.label ?? "–" : "–";\n    }', '    if (category === "around-the-green" || category === "bunker") {\n      if (side === "bot" && hole.botResultText && category === "around-the-green") return hole.botResultText;\n      const zones = category === "bunker" ? BOT_BUNKER_POINT_ZONES : CHIP_POINT_ZONES;\n      return typeof value === "number" ? zones.find((zone) => zone.points === value)?.label ?? "–" : "–";\n    }')

          # Both Chipping and Bunker go through the same simple short-game setup/length structure, but remain separate selections.
          s = s.replace('onClick={() => setStep(category === "around-the-green" ? "setup" : "length")}', 'onClick={() => setStep(category === "around-the-green" || category === "bunker" ? "setup" : "length")}')
          s = s.replace('<section className="mt-5"><p className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">Närspel</p><h1 className="mt-1 font-display text-4xl">Closest to Pin</h1>', '<section className="mt-5"><p className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">{category === "bunker" ? "Bunker • Match" : "Chipping • Match"}</p><h1 className="mt-1 font-display text-4xl">{category === "bunker" ? "Bunker" : "Chipping"}</h1>')
          s = s.replace('else if (step === "length") setStep(category === "around-the-green" ? "setup" : "category");', 'else if (step === "length") setStep(category === "around-the-green" || category === "bunker" ? "setup" : "category");')

          # Registration options: bunker swaps only the outer two zones.
          s = s.replace('{CHIP_POINT_ZONES.map((zone) =>', '{(category === "bunker" ? BOT_BUNKER_POINT_ZONES : CHIP_POINT_ZONES).map((zone) =>')

          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git commit -m "Separate chipping and bunker match choices"
          git push
