name: Patch approach setup UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch approach setup and match top bar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()

          old = '''{step === "approach-setup" && isApproach ? <><section className="mt-5"><p className="text-[10px] font-bold uppercase text-slate-500">Inspel · Closest to Pin</p><h1 className="mt-1 font-display text-4xl">Välj avstånd</h1><p className="mt-2 text-sm text-slate-600">Välj ett eller flera fasta intervall, eller skapa ett eget.</p></section>{!approachRanges.includes("custom") ? <><div className="mt-5"><p className="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Fasta intervall</p><div className="mt-2 grid grid-cols-3 gap-2">{([[["50-100","50–100"],["100-150","100–150"],["150-200","150–200"]]] as const)[0].map(([id,label]) => { const active = approachRanges.includes(id); return <button key={id} onClick={() => toggleApproachRange(id)} className={`rounded-2xl border px-2 py-4 text-center ${active ? selectedGlass : glass}`}><span className="block font-display text-xl leading-none">{label}</span><span className="mt-1 block text-[9px] font-bold uppercase text-slate-500">meter</span>{active ? <Check className="mx-auto mt-2 h-4 w-4 text-blue-600" /> : null}</button>; })}</div></div><div className="my-4 flex items-center gap-3"><span className="h-px flex-1 bg-slate-300/80" /><span className="text-[9px] font-bold uppercase tracking-[0.16em] text-slate-400">eller</span><span className="h-px flex-1 bg-slate-300/80" /></div></> : null}<button onClick={() => toggleApproachRange("custom")} className={`w-full rounded-2xl border px-4 py-4 text-left ${approachRanges.includes("custom") ? selectedGlass : glass}`}><span className="flex items-center justify-between"><span><span className="block font-display text-xl">Eget intervall</span><span className="mt-1 block text-[10px] font-semibold text-slate-500">30–250 meter</span></span>{approachRanges.includes("custom") ? <Check className="h-5 w-5 text-blue-600" /> : <ChevronRight className="h-5 w-5 text-slate-400" />}</span></button>{approachRanges.includes("custom") ? <div className={`mt-3 rounded-3xl border p-5 ${glass}`}><div className="flex items-end justify-between"><div><p className="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Eget intervall</p><p className="mt-1 text-xs text-slate-500">Dra lägsta och högsta avståndet.</p></div><p className="font-display text-2xl text-slate-900">{approachCustomMin}–{approachCustomMax} m</p></div><div className="relative mt-7 h-8"><div className="absolute left-0 right-0 top-3 h-2 rounded-full bg-slate-200" /><div className="absolute top-3 h-2 rounded-full bg-slate-900" style={{ left: `${((approachCustomMin - 30) / 220) * 100}%`, right: `${100 - ((approachCustomMax - 30) / 220) * 100}%` }} /><input aria-label="Lägsta avstånd" type="range" min={30} max={249} step={1} value={approachCustomMin} onChange={(e) => setApproachCustomMin(Math.min(Number(e.target.value), approachCustomMax - 1))} className="pointer-events-none absolute inset-x-0 top-0 h-8 w-full appearance-none bg-transparent [&::-webkit-slider-runnable-track]:bg-transparent [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-slate-950 [&::-webkit-slider-thumb]:shadow-md" /><input aria-label="Högsta avstånd" type="range" min={31} max={250} step={1} value={approachCustomMax} onChange={(e) => setApproachCustomMax(Math.max(Number(e.target.value), approachCustomMin + 1))} className="pointer-events-none absolute inset-x-0 top-0 h-8 w-full appearance-none bg-transparent [&::-webkit-slider-runnable-track]:bg-transparent [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-slate-950 [&::-webkit-slider-thumb]:shadow-md" /></div><div className="mt-1 flex justify-between text-[10px] font-bold text-slate-500"><span>30 m</span><span>250 m</span></div></div> : null}<button disabled={!approachSetupValid} onClick={() => setStep("length")} className="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-4 font-display text-xl text-white disabled:opacity-30">Nästa <ChevronRight className="h-5 w-5" /></button></> : null}'''

          new = '''{step === "approach-setup" && isApproach ? <><section className="mt-5"><p className="text-[10px] font-bold uppercase text-slate-500">Inspel · Closest to Pin</p><h1 className="mt-1 font-display text-4xl">Välj avstånd</h1><p className="mt-2 text-sm text-slate-600">Välj ett eller flera fasta intervall, eller skapa ett eget.</p></section>{!approachRanges.includes("custom") ? <><div className="mt-5"><div className="flex items-baseline justify-between gap-3"><p className="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Fasta intervall</p><p className="text-[10px] font-semibold text-slate-400">Välj ett eller flera avstånd</p></div><div className="mt-2 grid grid-cols-3 gap-2.5">{([[["50-100","50–100"],["100-150","100–150"],["150-200","150–200"]]] as const)[0].map(([id,label]) => { const active = approachRanges.includes(id); return <button key={id} onClick={() => toggleApproachRange(id)} className={`min-h-[74px] rounded-2xl border px-2 py-5 text-center transition-all ${active ? "border-blue-500 bg-blue-50 text-blue-700 shadow-[0_8px_22px_-18px_rgba(37,99,235,.7)]" : "border-slate-300/80 bg-white/60 text-slate-700 opacity-60"}`}><span className="block font-display text-xl leading-none">{label}</span><span className={`mt-1 block text-[9px] font-bold uppercase ${active ? "text-blue-500" : "text-slate-500"}`}>meter</span></button>; })}</div></div><div className="my-4 flex items-center gap-3"><span className="h-px flex-1 bg-slate-300/80" /><span className="text-[9px] font-bold uppercase tracking-[0.16em] text-slate-400">eller</span><span className="h-px flex-1 bg-slate-300/80" /></div></> : null}<button onClick={() => toggleApproachRange("custom")} className={`${approachRanges.includes("custom") ? "mt-5 border-blue-400 bg-blue-50/70" : ""} w-full rounded-2xl border px-4 py-4 text-left ${approachRanges.includes("custom") ? "text-blue-800" : glass}`}><span className="flex items-center justify-between"><span><span className="block font-display text-xl">Eget intervall</span><span className="mt-1 block text-[10px] font-semibold text-slate-500">30–250 meter</span></span>{approachRanges.includes("custom") ? <ChevronRight className="h-5 w-5 rotate-90 text-blue-500" /> : <ChevronRight className="h-5 w-5 text-slate-400" />}</span></button>{approachRanges.includes("custom") ? <div className={`mt-4 rounded-3xl border p-5 ${glass}`}><div className="flex items-start justify-between gap-3"><div><p className="text-[10px] font-bold uppercase tracking-[0.14em] text-slate-500">Eget intervall</p><p className="mt-1 text-xs text-slate-500">Dra lägsta och högsta avståndet.</p></div><button type="button" onClick={() => setApproachRanges([])} className="shrink-0 rounded-full border border-slate-300 bg-white/80 px-3 py-1.5 text-[9px] font-bold text-slate-600">← Fasta intervall</button></div><p className="mt-4 text-center font-display text-3xl text-slate-900">{approachCustomMin}–{approachCustomMax} m</p><div className="relative mt-5 h-8"><div className="absolute left-0 right-0 top-3 h-2 rounded-full bg-blue-100" /><div className="absolute top-3 h-2 rounded-full bg-blue-400" style={{ left: `${((approachCustomMin - 30) / 220) * 100}%`, right: `${100 - ((approachCustomMax - 30) / 220) * 100}%` }} /><input aria-label="Lägsta avstånd" type="range" min={30} max={249} step={1} value={approachCustomMin} onChange={(e) => setApproachCustomMin(Math.min(Number(e.target.value), approachCustomMax - 1))} className="pointer-events-none absolute inset-x-0 top-0 h-8 w-full appearance-none bg-transparent [&::-webkit-slider-runnable-track]:bg-transparent [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-blue-500 [&::-webkit-slider-thumb]:shadow-md" /><input aria-label="Högsta avstånd" type="range" min={31} max={250} step={1} value={approachCustomMax} onChange={(e) => setApproachCustomMax(Math.max(Number(e.target.value), approachCustomMin + 1))} className="pointer-events-none absolute inset-x-0 top-0 h-8 w-full appearance-none bg-transparent [&::-webkit-slider-runnable-track]:bg-transparent [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-[3px] [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-blue-500 [&::-webkit-slider-thumb]:shadow-md" /></div><div className="mt-1 flex justify-between text-[10px] font-bold text-slate-500"><span>30 m</span><span>250 m</span></div></div> : null}<button disabled={!approachSetupValid} onClick={() => setStep("length")} className="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-4 font-display text-xl text-white disabled:opacity-30">Nästa <ChevronRight className="h-5 w-5" /></button></> : null}'''

          if old not in s:
              raise SystemExit('Approach setup target not found')
          s = s.replace(old, new, 1)

          s = s.replace('truncate text-[10px] font-extrabold uppercase leading-tight', 'truncate text-[12px] font-black uppercase leading-tight', 2)
          s = s.replace('mt-1 text-[8px] font-bold uppercase tracking-[0.16em] text-blue-100', 'mt-0.5 text-[9px] font-bold uppercase tracking-[0.14em] text-blue-100', 1)
          s = s.replace('mt-1 text-[8px] font-bold uppercase tracking-[0.16em] text-red-100', 'mt-0.5 text-[9px] font-bold uppercase tracking-[0.14em] text-red-100', 1)

          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git commit -m "Refine approach setup and match top bar"
          git push
