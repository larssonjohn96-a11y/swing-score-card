name: Add Speed Match
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-speed-match.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Speed Match patch
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          old = subprocess.check_output([
              'git','show','a40ac06f5d8807a47186a292d55b6c9d3b5a4aab:.github/workflows/add-speed-match.yml'
          ], text=True)
          start = old.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = old.index("\n          PY", start)
          body = old[start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/add_speed_match.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/add_speed_match.py
      - name: Commit Speed Match
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/match.tsx src/lib/match-multiplayer.ts
          git commit -m 'Add Speed Match Play category'
          git push
      - name: Typecheck
        continue-on-error: true
        run: bunx tsgo --noEmit
