name: SG4 Validation Report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sg4-validation-report.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Focused tests
        run: bun test src/lib/shot-bank/shot-bank.test.ts src/lib/hcp-audit.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
