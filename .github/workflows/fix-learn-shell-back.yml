name: Fix Learn shell and back navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-learn-shell-back.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch Learn shell and nested back behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/learn.tsx')
          s = p.read_text()

          s = s.replace('''  const [lessonVisible, setLessonVisible] = useState(false);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);''', '''  const [lessonVisible, setLessonVisible] = useState(false);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);\n  const sessionHistoryRef = useRef(false);''')

          anchor = '''  useEffect(() => {\n    const timer = window.setTimeout(() => selectedRef.current?.scrollIntoView({ behavior: "auto", block: "center" }), 80);\n    return () => window.clearTimeout(timer);\n  }, []);\n'''
          insert = anchor + '''\n  useEffect(() => {\n    const onPopState = () => {\n      if (!sessionHistoryRef.current) return;\n      sessionHistoryRef.current = false;\n      setLessonVisible(false);\n      window.setTimeout(() => setSession(null), 280);\n    };\n    window.addEventListener("popstate", onPopState);\n    return () => window.removeEventListener("popstate", onPopState);\n  }, []);\n\n  function openSessionHistory() {\n    if (sessionHistoryRef.current) return;\n    window.history.pushState({ sg4LearnSession: true }, "", window.location.href);\n    sessionHistoryRef.current = true;\n  }\n'''
          if anchor not in s: raise SystemExit('effect anchor missing')
          s = s.replace(anchor, insert)

          s = s.replace('''    setLessonVisible(false);\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });''', '''    setLessonVisible(false);\n    openSessionHistory();\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });''')
          s = s.replace('''    setLessonVisible(false);\n    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });''', '''    setLessonVisible(false);\n    openSessionHistory();\n    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });''')

          old_close = '''  function closeLesson() {\n    setLessonVisible(false);\n    window.setTimeout(() => setSession(null), 280);\n  }'''
          new_close = '''  function closeLesson() {\n    if (sessionHistoryRef.current) {\n      window.history.back();\n      return;\n    }\n    setLessonVisible(false);\n    window.setTimeout(() => setSession(null), 280);\n  }'''
          if old_close not in s: raise SystemExit('closeLesson missing')
          s = s.replace(old_close, new_close)

          s = s.replace('''    setLessonVisible(false);\n    window.setTimeout(() => setSession(null), 280);\n  }\n\n  function nextLesson()''', '''    if (sessionHistoryRef.current) {\n      window.history.back();\n    } else {\n      setLessonVisible(false);\n      window.setTimeout(() => setSession(null), 280);\n    }\n  }\n\n  function nextLesson()''')

          s = s.replace('''    <main className="min-h-screen overflow-x-hidden bg-[#242728] pb-32 text-white">''', '''    <main className="fixed inset-0 overflow-x-hidden overflow-y-auto bg-[#242728] pb-32 text-white overscroll-none">''')
          s = s.replace('''className="flex h-10 w-10 items-center justify-center rounded-2xl border border-white/10 bg-white/[.05]"><ArrowLeft''', '''aria-label="Tillbaka till Learn" className="flex h-10 w-10 items-center justify-center rounded-2xl border border-white/10 bg-white/[.05]"><ArrowLeft''')

          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/learn.tsx
          git commit -m "Keep Learn full-screen and contain lesson back navigation"
          git push
