name: Fix bot selector fixed CTA v2

on:
  push:
    paths:
      - '.github/workflows/fix-bot-selector-fixed-cta-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch match-bot selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()

          # Remove country and flag from bot data/model.
          s = s.replace('  country: string;\n  flag: string;\n', '')
          s = s.replace('country, flag, ', '')
          s = s.replace('country: string; flag: string; ', '')
          s = re.sub(r', country: "[^"]*", flag: "[^"]*"', '', s)

          # Remove any remaining country/flag rendering in the selector header.
          s = re.sub(r'\s*<span className="text-lg">\{bot\.flag\}</span>', '', s)
          s = re.sub(r'<span>\{bot\.country\}</span>', '', s)
          s = s.replace('items-center justify-between border-t', 'items-center justify-end border-t')

          # Force the play CTA to be viewport fixed. Match the wrapper by its unique gradient and max-width.
          pattern = re.compile(r'<div className="[^"]*bg-gradient-to-t from-white via-white/95 to-white/0 px-5 pb-\[calc\(env\(safe-area-inset-bottom\)\+16px\)\] pt-8"(?: style=\{\{[^>]*\}\})?>')
          replacement = '<div className="w-full bg-gradient-to-t from-white via-white/95 to-white/0 px-5 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-8" style={{ position: "fixed", left: "50%", bottom: 0, transform: "translateX(-50%)", width: "100%", maxWidth: "28rem", zIndex: 80 }}>'
          s, n = pattern.subn(replacement, s, count=1)
          if n == 0:
              # fallback: directly replace known fixed wrapper fragment if formatting differs
              s = s.replace('className="fixed bottom-0 left-1/2 z-40 w-full max-w-md -translate-x-1/2 bg-gradient-to-t from-white via-white/95 to-white/0 px-5 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-8"', 'className="w-full bg-gradient-to-t from-white via-white/95 to-white/0 px-5 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-8" style={{ position: "fixed", left: "50%", bottom: 0, transform: "translateX(-50%)", width: "100%", maxWidth: "28rem", zIndex: 80 }}', 1)

          s = s.replace('step === "bot" ? "pt-6 pb-40"', 'step === "bot" ? "pt-6 pb-52"')
          s = s.replace('step === "bot" ? "pt-6 pb-44"', 'step === "bot" ? "pt-6 pb-52"')

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Fix bot selector CTA and remove countries"
          git push
