name: Apply putting and sudden death v2

on:
  push:
    paths:
      - scripts/patch-putting-sudden-death-v2.py
      - .github/workflows/apply-putting-sudden-death-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-putting-sudden-death-v2.py
      - name: Commit changes and clean patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git rm scripts/patch-putting-sudden-death-v2.py .github/workflows/apply-putting-sudden-death-v2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine putting setup and sudden death clash"
          git push origin HEAD:main
