name: Refine Speed Match
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-match-category-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Speed Match refinement
        run: |
          python .github/scripts/refine_speed_match.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          s = s.replace('${isSpeed ? "Omgång" : "Hål"} ${Math.min(holeIndex + 1, matchLength)} av ${matchLength}', '${category === "speed" ? "Omgång" : "Hål"} ${Math.min(holeIndex + 1, matchLength)} av ${matchLength}', 1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/match.tsx
          git commit -m 'Refine Speed Match controls and ordering'
          git push
