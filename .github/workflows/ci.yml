name: Apply Approach Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_approach.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/routes/match.tsx
          git diff --cached --quiet || git commit -m "Update Approach competition flow"
          git push
