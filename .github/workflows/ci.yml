name: CI
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '' | base64 -d | python3
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/routes/match.tsx
          git diff --cached --quiet || git commit -m 'Fix match edit flow and reduce team glow'
          git push
