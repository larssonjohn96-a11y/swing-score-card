name: Fix Approach Typecheck

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_type_error.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/routes/match.tsx
          git diff --cached --quiet || git commit -m "Fix Approach type narrowing"
          git push
