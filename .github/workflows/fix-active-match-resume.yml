name: Fix active match resume
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-active-match-resume.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Keep active match backup for cloud and local matches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/match.tsx')
          s=p.read_text()
          old='''    if (matchSessionId || new URLSearchParams(window.location.search).has("session")) {\n      window.localStorage.removeItem(LOCAL_MATCH_KEY);\n      return;\n    }\n'''
          if old not in s:
              raise SystemExit('cloud local-backup branch missing')
          s=s.replace(old,'',1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Keep active friend match progress across app exits" || exit 0
          git push
