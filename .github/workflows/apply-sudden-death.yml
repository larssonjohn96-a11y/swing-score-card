name: Apply sudden death match patch

on:
  push:
    paths:
      - scripts/patch-sudden-death.py
      - .github/workflows/apply-sudden-death.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-sudden-death.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx src/routes/match-bot.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 11m sudden death and 3 5 7 match lengths"
          git push origin HEAD:main
