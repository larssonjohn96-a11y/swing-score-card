name: Fix play-only result recommendations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-play-only-result-recs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep match result recommendations inside play
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          old_import = 'import { getRecommendationsForSkill } from "@/lib/sg4-surface-recommendations";'
          new_import = 'import { getPlayRecommendations } from "@/lib/sg4-surface-recommendations";'
          old_block = '''  const resultEngineSkill = engineSkillForMatchCategory(category);\n  const resultRecommendation = resultEngineSkill ? getRecommendationsForSkill(resultEngineSkill, 1)[0] : undefined;\n  const playActivityId = mode === "singles" ? "play-friend" : mode ? "play-team" : null;'''
          new_block = '''  const playActivityId = mode === "singles" ? "play-friend" : mode ? "play-team" : null;\n  const resultRecommendation = getPlayRecommendations(1, playActivityId ? [playActivityId] : [])[0];'''
          if old_import not in s:
              raise SystemExit('Old recommendation import not found')
          if old_block not in s:
              raise SystemExit('Old result recommendation block not found')
          s = s.replace(old_import, new_import).replace(old_block, new_block)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/match.tsx
          git commit -m 'Keep match result recommendations inside play'
          git push
