name: Match Edit Glow Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scored hole edit flow and tighten team glow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()

          s = s.replace(
            'const blueGlass = "border-blue-300/55 bg-gradient-to-br from-blue-100/68 via-white/68 to-slate-100/72 shadow-[0_18px_44px_-32px_rgba(37,99,235,.46)] backdrop-blur-2xl";',
            'const blueGlass = "border-blue-300/60 bg-gradient-to-br from-blue-100/58 via-white/74 to-slate-100/76 shadow-[0_10px_24px_-20px_rgba(15,23,42,.22)] backdrop-blur-2xl";'
          )
          s = s.replace(
            'const redGlass = "border-red-300/55 bg-gradient-to-br from-red-100/62 via-white/68 to-slate-100/72 shadow-[0_18px_44px_-32px_rgba(239,68,68,.40)] backdrop-blur-2xl";',
            'const redGlass = "border-red-300/60 bg-gradient-to-br from-red-100/54 via-white/74 to-slate-100/76 shadow-[0_10px_24px_-20px_rgba(15,23,42,.22)] backdrop-blur-2xl";'
          )

          old = '''  function finishScoredEdit(next: Hole[], registered: number) {
    setHoles(next);
    setTransitionMessage(`${unitLabel} ${registered + 1} uppdaterad`);
    window.setTimeout(() => {
      const target = returnHoleIndex ?? next.findIndex((h) => h.winner === null);
      const nextIndex = target >= 0 ? target : registered;
      setHoleIndex(nextIndex);
      const targetHole = next[nextIndex];
      setBlueStrokes(targetHole?.blueStrokes ?? 1); setRedStrokes(targetHole?.redStrokes ?? 1);
      setBluePoints(typeof targetHole?.bluePoints === "number" ? targetHole.bluePoints : null); setRedPoints(typeof targetHole?.redPoints === "number" ? targetHole.redPoints : null);
      setEditingHoleIndex(null); setReturnHoleIndex(null); setTransitionMessage(null); setIsSubmitting(false);
    }, 380);
  }'''
          new = '''  function finishScoredEdit(next: Hole[], registered: number) {
    setHoles(next);
    const target = returnHoleIndex ?? next.findIndex((h) => h.winner === null);
    const nextIndex = target >= 0 ? target : registered;
    setHoleIndex(nextIndex);
    const targetHole = next[nextIndex];
    setBlueStrokes(targetHole?.blueStrokes ?? 1); setRedStrokes(targetHole?.redStrokes ?? 1);
    setBluePoints(typeof targetHole?.bluePoints === "number" ? targetHole.bluePoints : null); setRedPoints(typeof targetHole?.redPoints === "number" ? targetHole.redPoints : null);
    setEditingHoleIndex(null); setReturnHoleIndex(null); setIsSubmitting(false);
    setTransitionMessage(`${unitLabel} ${registered + 1} uppdaterad`);
    window.setTimeout(() => setTransitionMessage(null), 520);
  }'''
          if old not in s:
            raise SystemExit('finishScoredEdit anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace(
            '{isSubmitting ? "Registrerar…" : editingHoleIndex !== null ? `Spara ${unitLabel.toLowerCase()} ${holeIndex + 1}` : `Registrera ${unitLabel.toLowerCase()} ${holeIndex + 1}`}',
            '{isSubmitting ? (editingHoleIndex !== null ? "Sparar ändring…" : "Registrerar…") : editingHoleIndex !== null ? `Spara ${unitLabel.toLowerCase()} ${holeIndex + 1}` : `Registrera ${unitLabel.toLowerCase()} ${holeIndex + 1}`}'
          )

          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/routes/match.tsx
          git diff --cached --quiet || git commit -m "Fix match edit flow and reduce team glow"
          git push
