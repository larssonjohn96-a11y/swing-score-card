name: Improve match distance variety
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-match-distance-variety.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch generators and test
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          p = Path('src/lib/putting-match.ts')
          s = p.read_text()
          start = s.index('export function generatePuttingMatchDistances')
          end = s.index('\nexport function formatPuttingDistance', start)
          replacement = '''export function generatePuttingMatchDistances(length: PuttingMatchLength): number[] {
  // Deliberately interleave short / medium / long putts instead of shuffling bands.
  // Variety is part of the match design: consecutive holes should feel clearly different.
  const bandOrder = length === 3
    ? [0, 1, 2]
    : length === 5
      ? [0, 1, 2, 0, 2]
      : [0, 1, 2, 1, 0, 1, 2];
  const reverse = Math.random() < 0.5;
  const orderedBandIndexes = reverse ? bandOrder.map((index) => 2 - index) : bandOrder;
  const distances: number[] = [];
  const minGap = 5;

  for (const bandIndex of orderedBandIndexes) {
    const band = PUTTING_DISTANCE_BANDS[bandIndex];
    const previous = distances.at(-1);
    const all = Array.from({ length: band.max - band.min + 1 }, (_, index) => band.min + index);
    const unused = all.filter((distance) => !distances.includes(distance));
    const pool = unused.length ? unused : all;
    const varied = previous === undefined ? pool : pool.filter((distance) => Math.abs(distance - previous) >= minGap);
    const allowedDistances = varied.length ? varied : pool;

    distances.push(
      selectNextEngineDistance({
        skill: "putting",
        objective: "balanced",
        min: band.min,
        max: band.max,
        previousDistance: previous,
        allowedDistances,
      }),
    );
  }
  return distances;
}
'''
          s = s[:start] + replacement + s[end:]
          s = s.replace(' * Behåller kort/medel/lång-spridningen, men SG4-motorn väljer exakt avstånd\n * utifrån spelarens historik och aktuell balans mellan flow och inlärning.\n * Avstånden hålls unika inom matchen när intervallet tillåter det.\n', ' * Varierar aktivt kort / medel / lång mellan hålen. SG4-motorn väljer fortfarande\n * exakt avstånd inom varje band, men variation mellan hålen prioriteras först.\n * Avstånden hålls unika när möjligt och nästa hål försöker skilja minst 5 meter.\n')
          p.write_text(s)

          p = Path('src/lib/chip-match.ts')
          s = p.read_text()
          start = s.index('export function generateChipMatchDistances')
          end = len(s)
          replacement = '''export function generateChipMatchDistances(length: ChipMatchLength): number[] {
  // Keep the match moving between clearly different shot lengths.
  // Never let random band shuffling create a run of similar chips.
  const bandOrder = length === 3
    ? [0, 1, 2]
    : length === 5
      ? [0, 1, 2, 0, 2]
      : [0, 1, 2, 1, 0, 1, 2];
  const reverse = Math.random() < 0.5;
  const orderedBandIndexes = reverse ? bandOrder.map((index) => 2 - index) : bandOrder;
  const distances: number[] = [];
  const minGap = 6;

  for (const bandIndex of orderedBandIndexes) {
    const band = CHIP_DISTANCE_BANDS[bandIndex];
    const previous = distances.at(-1);
    const all = Array.from({ length: band.max - band.min + 1 }, (_, index) => band.min + index);
    const unused = all.filter((distance) => !distances.includes(distance));
    const pool = unused.length ? unused : all;
    const varied = previous === undefined ? pool : pool.filter((distance) => Math.abs(distance - previous) >= minGap);
    const allowedDistances = varied.length ? varied : pool;

    distances.push(
      selectNextEngineDistance({
        skill: "chip",
        objective: "balanced",
        min: band.min,
        max: band.max,
        previousDistance: previous,
        allowedDistances,
      }),
    );
  }
  return distances;
}
'''
          s = s[:start] + replacement + '\n'
          s = s.replace(' * Behåller kort/medel/lång-mixen men låter SG4-motorn välja de exakta metrarna\n * utifrån spelarens historik, flow, learning value, mastery och exploration.\n * Efter valet säkras minst 4 meters skillnad mot föregående hål så matchen\n * inte ger nästan identiska längder två gånger i rad.\n', ' * Växlar aktivt mellan kort / medel / lång så varje hål känns annorlunda.\n * SG4-motorn väljer fortfarande exakt meter inom bandet, men nästa chip försöker\n * skilja minst 6 meter och avstånd återanvänds inte när det går att undvika.\n')
          p.write_text(s)
          PY
          python3 /tmp/patch.py
          bun install --frozen-lockfile
          bun run build
          bunx vitest run src/lib/bot-skill-model.test.ts src/lib/bot-match-pressure.test.ts --passWithNoTests
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/putting-match.ts src/lib/chip-match.ts
          git commit -m "Prioritize distance variety in putting and chipping matches"
          git push
