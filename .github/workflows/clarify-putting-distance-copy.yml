name: Clarify putting distance copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-putting-distance-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Clarify putting distance text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/match.tsx')
          s=p.read_text()
          old='return { eyebrow: "Puttning", title: formatPuttingDistance(distance), detail: `Samma position · håla ut · färre puttar vinner${suffix}` };'
          new='return { eyebrow: "Puttning", title: formatPuttingDistance(distance), detail: `${formatPuttingDistance(distance)} från flaggan · håla ut · färre puttar vinner${suffix}` };'
          if old not in s:
              raise SystemExit('putting copy anchor missing')
          p.write_text(s.replace(old,new,1))

          pb=Path('src/routes/match-bot.tsx')
          sb=pb.read_text()
          sb=sb.replace('Samma position · håla ut · färre puttar vinner', '${formatPuttingDistance(distance)} från flaggan · håla ut · färre puttar vinner')
          pb.write_text(sb)
          PY
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git commit -m "Clarify putting distance in match copy" || exit 0
          git push
