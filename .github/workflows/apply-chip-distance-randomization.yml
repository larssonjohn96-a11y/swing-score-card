name: Apply Chip Match distance randomization

on:
  push:
    paths:
      - .github/workflows/apply-chip-distance-randomization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Chip Match changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          helper = textwrap.dedent('''\
          /**
           * Gemensam regelkälla för SG4:s Chip Match.
           * Ett enda spel – bara matchlängden (3/5/7 hål) skiljer.
           */

          export type ChipMatchLength = 3 | 5 | 7;
          export type ChipDistanceBandId = "short" | "medium" | "long";

          export const CHIP_MATCH_FORMATS = [
            { length: 3, name: "3 hål", label: "", detail: "" },
            { length: 5, name: "5 hål", label: "", detail: "", recommended: true },
            { length: 7, name: "7 hål", label: "", detail: "" },
          ] as const;

          export const CHIP_DISTANCE_BANDS = [
            { id: "short", label: "Kort chip", range: "8–14 m", min: 8, max: 14 },
            { id: "medium", label: "Medel chip", range: "15–22 m", min: 15, max: 22 },
            { id: "long", label: "Lång chip", range: "23–30 m", min: 23, max: 30 },
          ] as const;

          export const CHIP_MATCH_RULES = [
            "Korta 8–14 m · Medel 15–22 m · Långa 23–30 m.",
            "Avstånden och ordningen slumpas inför varje ny match. Samma exakta meter kan förekomma flera gånger.",
            "Båda spelarna chippar från exakt samma avstånd på varje hål.",
            "Ett slag per spelare. Välj poängzon efter var bollen stannar.",
            "Högst poäng vinner hålet, lika poäng delar hålet.",
          ];

          export const CHIP_POINT_ZONES = [
            { points: 4, label: "Sänkt" },
            { points: 3, label: "Inom 1 m" },
            { points: 2, label: "Inom 2 m" },
            { points: 1, label: "Inom 5 m" },
            { points: 0, label: "Över 5 m" },
          ] as const;

          function rand(min: number, max: number) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
          }

          function shuffle<T>(items: readonly T[]) {
            const next = [...items];
            for (let i = next.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [next[i], next[j]] = [next[j], next[i]];
            }
            return next;
          }

          export function getChipDistanceBand(distance: number) {
            if (distance <= 14) return CHIP_DISTANCE_BANDS[0];
            if (distance <= 22) return CHIP_DISTANCE_BANDS[1];
            return CHIP_DISTANCE_BANDS[2];
          }

          export function generateChipMatchDistances(length: ChipMatchLength): number[] {
            const quotas = length === 3 ? [1, 1, 1] : length === 5 ? [2, 1, 2] : [2, 3, 2];
            const distances = CHIP_DISTANCE_BANDS.flatMap((band, index) =>
              Array.from({ length: quotas[index] }, () => rand(band.min, band.max)),
            );
            return shuffle(distances);
          }
          ''')
          Path('src/lib/chip-match.ts').write_text(helper)

          p = Path('src/routes/match.tsx')
          t = p.read_text()
          if 'from "@/lib/chip-match"' not in t:
            t = t.replace(
              'import { formatPuttingDistance, generatePuttingMatchDistances } from "@/lib/putting-match";\n',
              'import { formatPuttingDistance, generatePuttingMatchDistances } from "@/lib/putting-match";\nimport { generateChipMatchDistances, getChipDistanceBand } from "@/lib/chip-match";\n',
              1,
            )

          t, n1 = re.subn(
            r'  if \(category === "around-the-green"\) \{\n\s*return \{ eyebrow: "Chippning", title: `\$\{rand\(10, 30\)\} m`, detail: `Närmast hålet vinner\.\$\{suffix\}` \};\n\s*\}',
            '  if (category === "around-the-green") {\n    const distance = approachDistance ?? rand(8, 30);\n    const band = getChipDistanceBand(distance);\n    return { eyebrow: band.label, title: `${distance} m`, detail: `${band.range} · samma avstånd för båda · högst poäng vinner hålet${suffix}` };\n  }',
            t,
            count=1,
          )
          if n1 == 0 and 'const band = getChipDistanceBand(distance);' not in t:
            raise SystemExit('match.tsx: challenge pattern not found')

          t, n2 = re.subn(
            r': isShortGame\n\s*\? Array\.from\(\{ length: matchLength \}, \(\) => \(\{ challenge: generateChallenge\(category, matchType, mode\), winner: null as HoleWinner \}\)\)',
            ': isShortGame\n      ? generateChipMatchDistances(matchLength).map((distance) => ({ challenge: generateChallenge(category, matchType, mode, shortGameLies, distance), winner: null as HoleWinner }))',
            t,
            count=1,
          )
          if n2 == 0 and 'generateChipMatchDistances(matchLength).map((distance)' not in t:
            raise SystemExit('match.tsx: hole generation pattern not found')

          old = '<h1 className="mt-1 font-display text-4xl">{isPgaPutting ? "Matchlängd" : scoringMode === "stroke" ? "Antal hål" : "Bäst av"}</h1>{isPgaPutting ? <p className="mt-2 text-sm text-slate-600">Välj 3, 5 eller 7 hål. Alla längder får en mix av korta, mellanlånga och långa PGA Tour-avstånd.</p> : null}'
          new = '<h1 className="mt-1 font-display text-4xl">{isShortGame ? "Välj antal hål" : isPgaPutting ? "Matchlängd" : scoringMode === "stroke" ? "Antal hål" : "Bäst av"}</h1>{isShortGame ? <p className="mt-2 text-sm text-slate-600">Korta 8–14 m · Medel 15–22 m · Långa 23–30 m. Avstånden slumpas inför varje match.</p> : isPgaPutting ? <p className="mt-2 text-sm text-slate-600">Välj 3, 5 eller 7 hål. Alla längder får en mix av korta, mellanlånga och långa PGA Tour-avstånd.</p> : null}'
          if old in t:
            t = t.replace(old, new, 1)
          elif new not in t:
            raise SystemExit('match.tsx: length heading pattern not found')
          p.write_text(t)

          p = Path('src/routes/match-bot.tsx')
          t = p.read_text()
          if 'from "@/lib/chip-match"' not in t:
            t = t.replace(
              '} from "@/lib/putting-match";\nimport {\n  APPROACH_MATCH_FORMATS,',
              '} from "@/lib/putting-match";\nimport { generateChipMatchDistances, getChipDistanceBand } from "@/lib/chip-match";\nimport {\n  APPROACH_MATCH_FORMATS,',
              1,
            )

          t = t.replace(
            '    const puttingDistances = category === "putting" ? generatePuttingMatchDistances(length) : [];\n    const approachDistances = category === "approach" ? generateApproachMatchDistances(length) : [];',
            '    const puttingDistances = category === "putting" ? generatePuttingMatchDistances(length) : [];\n    const chipDistances = category === "around-the-green" ? generateChipMatchDistances(length) : [];\n    const approachDistances = category === "approach" ? generateApproachMatchDistances(length) : [];',
            1,
          )
          t, n3 = re.subn(
            r'      if \(category === "around-the-green"\) \{\n\s*const d = rand\(10, 30\);\n\s*return \{ title: `\$\{d\} m`, distance: d, detail: "Ett slag · högst zonpoäng vinner" \};\n\s*\}',
            '      if (category === "around-the-green") {\n        const d = chipDistances[holeNr] ?? 15;\n        const band = getChipDistanceBand(d);\n        return { title: `${d} m`, distance: d, detail: `${band.label} · ${band.range} · samma avstånd för båda` };\n      }',
            t,
            count=1,
          )
          if n3 == 0 and 'const d = chipDistances[holeNr] ?? 15;' not in t:
            raise SystemExit('match-bot.tsx: chip hole pattern not found')
          if 'const chipDistances = category === "around-the-green" ? generateChipMatchDistances(length) : [];' not in t:
            raise SystemExit('match-bot.tsx: chip distance list not inserted')
          p.write_text(t)
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Typecheck (known baseline failure)
        continue-on-error: true
        run: bunx tsc --noEmit

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chip-match.ts src/routes/match.tsx src/routes/match-bot.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve Chip Match distances"
          git push origin main
