name: Remove seven hole label
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-seven-hole-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove 7-hole label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/match.tsx')
          s=p.read_text()
          old='<span className="mt-2 block text-[9px] font-bold uppercase tracking-[0.12em] text-slate-500">{v === 3 ? "Snabb" : v === 5 ? "Standard" : "Lång"}</span>'
          new='{v === 3 ? <span className="mt-2 block text-[9px] font-bold uppercase tracking-[0.12em] text-slate-500">Snabb</span> : v === 5 ? <span className="mt-2 block text-[9px] font-bold uppercase tracking-[0.12em] text-blue-600">Standard</span> : null}'
          if old not in s:
              raise SystemExit('Target label not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/match.tsx
          git commit -m 'Remove long label from seven-hole format'
          git push
