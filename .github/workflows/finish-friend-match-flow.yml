name: Finish friend match flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-friend-match-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply friend match improvements
        run: python3 scripts/finish_friend_match_flow.py
      - name: Test and build
        run: |
          bun install --frozen-lockfile
          bunx vitest run src/lib/friend-match-experience.test.ts src/lib/motor-learning-policy.test.ts src/lib/bot-skill-model.test.ts src/lib/bot-match-pressure.test.ts --passWithNoTests
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Finish friend match core loop"
          git push
