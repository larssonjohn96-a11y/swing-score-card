name: Refine primary blue button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-primary-blue-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Refine primary CTA style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          old = 'const ryderNext = "group relative flex w-full items-center justify-center gap-2 overflow-hidden rounded-[20px] border border-blue-300/55 bg-[linear-gradient(180deg,rgba(96,165,250,.78)_0%,rgba(37,99,235,.88)_42%,rgba(29,78,216,.90)_100%)] py-4 font-display text-xl text-white shadow-[inset_0_1px_0_rgba(255,255,255,.58),inset_0_-1px_0_rgba(30,64,175,.35),0_14px_32px_-20px_rgba(37,99,235,.72)] backdrop-blur-2xl transition duration-200 active:scale-[.985] active:brightness-[.97] disabled:opacity-30";'
          new = 'const ryderNext = "group relative flex w-full items-center justify-center gap-2 rounded-[20px] border border-blue-700/35 bg-[#2563eb] py-4 font-display text-xl text-white shadow-[0_5px_0_#1d4ed8,0_10px_18px_-12px_rgba(29,78,216,.72)] transition duration-150 hover:bg-[#245bd7] active:translate-y-[2px] active:scale-[.995] active:bg-[#1f55c8] active:shadow-[0_3px_0_#1e40af,0_7px_14px_-12px_rgba(29,78,216,.65)] disabled:translate-y-0 disabled:opacity-30 disabled:shadow-[0_5px_0_#1d4ed8]";'
          if old not in s:
              raise SystemExit('primary button style anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx
          git commit -m "Refine friend match primary button" || exit 0
          git push
