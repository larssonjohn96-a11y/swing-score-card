name: Move bot info sticky

"on":
  push:
    paths:
      - .github/workflows/move-bot-info-sticky.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/move_bot_info_sticky.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit sticky bot info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Keep selected bot info visible"
          git push origin main
