name: Liquid Nav Active Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen floating liquid glass navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/bottom-nav.tsx')
          s = p.read_text()

          old = '''function NavLink({ tab, active, badge }: { tab: { to: string; label: string; icon: typeof Home }; active: boolean; badge?: number }) {
  return (
    <Link to={tab.to} className="flex flex-1 flex-col items-center gap-1 py-2 active:scale-95">
      <span className={`relative flex h-8 w-9 items-center justify-center rounded-xl transition-colors ${active ? "border border-white/45 bg-background/58 text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.65),0_6px_18px_-14px_rgba(15,23,42,.55)] backdrop-blur-xl" : "text-muted-foreground"}`}>
        <tab.icon className="h-5 w-5" />
        {Boolean(badge) && <span className="absolute -right-1 -top-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-flag px-1 text-[9px] font-bold text-background">{badge}</span>}
      </span>
      <span className={`text-[10px] font-medium uppercase tracking-wide transition-colors ${active ? "font-semibold text-primary" : "text-muted-foreground"}`}>{tab.label}</span>
    </Link>
  );
}'''
          new = '''function NavLink({ tab, active, badge }: { tab: { to: string; label: string; icon: typeof Home }; active: boolean; badge?: number }) {
  return (
    <Link
      to={tab.to}
      className={`mx-0.5 flex min-h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-[20px] px-1.5 py-1.5 transition-all duration-200 active:scale-[0.96] ${
        active
          ? "border border-white/70 bg-background/80 text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.9),0_8px_22px_-14px_rgba(15,23,42,.65)] backdrop-blur-2xl ring-1 ring-black/[0.035]"
          : "text-muted-foreground"
      }`}
    >
      <span className="relative flex h-7 w-8 items-center justify-center">
        <tab.icon className={`h-5 w-5 ${active ? "stroke-[2.35]" : "stroke-[1.9]"}`} />
        {Boolean(badge) && <span className="absolute -right-1 -top-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-flag px-1 text-[9px] font-bold text-background">{badge}</span>}
      </span>
      <span className={`text-[10px] uppercase tracking-wide ${active ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}>{tab.label}</span>
    </Link>
  );
}'''
          if old not in s:
            raise SystemExit('NavLink anchor not found')
          s = s.replace(old, new, 1)

          old_nav = '<nav className="fixed bottom-0 left-0 right-0 z-40 border-t border-white/45 bg-card/72 shadow-[0_-14px_38px_-26px_oklch(0.22_0.04_160/0.5)] backdrop-blur-2xl supports-[backdrop-filter]:bg-card/62" style={{ paddingBottom: "max(8px, env(safe-area-inset-bottom))" }}>'
          new_nav = '<nav className="fixed bottom-3 left-1/2 z-40 w-[calc(100%-24px)] max-w-md -translate-x-1/2 overflow-visible rounded-[30px] border border-white/70 bg-card/68 shadow-[0_18px_48px_-20px_rgba(15,23,42,.48),inset_0_1px_0_rgba(255,255,255,.88)] backdrop-blur-[28px] supports-[backdrop-filter]:bg-card/58" style={{ paddingBottom: "max(6px, env(safe-area-inset-bottom))" }}>'
          if old_nav not in s:
            raise SystemExit('nav anchor not found')
          s = s.replace(old_nav, new_nav, 1)

          old_inner = '<div className="mx-auto flex h-16 w-full max-w-md items-center px-2">'
          new_inner = '<div className="mx-auto flex h-16 w-full items-center gap-0.5 px-2.5 pt-1">'
          if old_inner not in s:
            raise SystemExit('inner nav anchor not found')
          s = s.replace(old_inner, new_inner, 1)

          old_plus = 'className="flex h-12 w-12 -translate-y-4 items-center justify-center rounded-full border border-white/55 bg-primary/92 text-primary-foreground shadow-[inset_0_1px_0_rgba(255,255,255,.42),0_10px_24px_-12px_oklch(0_0_0_/_0.5)] backdrop-blur-xl ring-1 ring-black/5 transition-transform active:scale-95"'
          new_plus = 'className="flex h-13 w-13 -translate-y-3 items-center justify-center rounded-full border border-white/70 bg-primary/92 text-primary-foreground shadow-[inset_0_1px_0_rgba(255,255,255,.48),0_12px_28px_-10px_rgba(15,23,42,.48)] backdrop-blur-2xl ring-1 ring-black/[0.05] transition-all active:scale-95"'
          if old_plus not in s:
            raise SystemExit('plus anchor not found')
          s = s.replace(old_plus, new_plus, 1)

          old_more = '''<button type="button" onClick={() => setMoreOpen(true)} className="flex flex-1 flex-col items-center gap-1 py-2 active:scale-95" aria-label="Mer">
            <span className={`relative flex h-8 w-9 items-center justify-center rounded-xl transition-colors ${moreActive ? "border border-white/45 bg-background/58 text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.65),0_6px_18px_-14px_rgba(15,23,42,.55)] backdrop-blur-xl" : "text-muted-foreground"}`}><Menu className="h-5 w-5" />{Boolean(trophyBadge) && <span className="absolute -right-1 -top-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-flag px-1 text-[9px] font-bold text-background">{trophyBadge}</span>}</span>
            <span className={`text-[10px] font-medium uppercase tracking-wide ${moreActive ? "font-semibold text-primary" : "text-muted-foreground"}`}>Mer</span>
          </button>'''
          new_more = '''<button type="button" onClick={() => setMoreOpen(true)} className={`mx-0.5 flex min-h-12 flex-1 flex-col items-center justify-center gap-0.5 rounded-[20px] px-1.5 py-1.5 transition-all duration-200 active:scale-[0.96] ${moreActive ? "border border-white/70 bg-background/80 text-primary shadow-[inset_0_1px_0_rgba(255,255,255,.9),0_8px_22px_-14px_rgba(15,23,42,.65)] backdrop-blur-2xl ring-1 ring-black/[0.035]" : "text-muted-foreground"}`} aria-label="Mer">
            <span className="relative flex h-7 w-8 items-center justify-center"><Menu className={`h-5 w-5 ${moreActive ? "stroke-[2.35]" : "stroke-[1.9]"}`} />{Boolean(trophyBadge) && <span className="absolute -right-1 -top-1 flex h-4 min-w-[16px] items-center justify-center rounded-full bg-flag px-1 text-[9px] font-bold text-background">{trophyBadge}</span>}</span>
            <span className={`text-[10px] uppercase tracking-wide ${moreActive ? "font-bold text-primary" : "font-medium text-muted-foreground"}`}>Mer</span>
          </button>'''
          if old_more not in s:
            raise SystemExit('more anchor not found')
          s = s.replace(old_more, new_more, 1)

          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/components/bottom-nav.tsx
          git diff --cached --quiet || git commit -m "Strengthen floating Liquid Glass nav active state"
          git push
