name: Patch compact approach input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compact approach play UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          reps = [
            ('isApproach ? <section className="mt-4"><div className={`rounded-[24px] border px-4 py-3', 'isApproach ? <section className="mt-2"><div className={`rounded-[22px] border px-3 py-2'),
            ('</div><div className={`mt-3 rounded-[26px] border p-4 ${glass}`}><div><div className="flex items-center justify-between">', '</div><div className={`mt-2 rounded-[24px] border p-3 ${glass}`}><div><div className="flex items-center justify-between">'),
            ('<div className="mt-2 flex items-center justify-center rounded-2xl bg-slate-100 py-3">', '<div className="mt-1.5 flex items-center justify-center rounded-2xl bg-slate-100 py-2">'),
            ('<div className="mt-3 grid grid-cols-4 gap-2">', '<div className="mt-2 grid grid-cols-4 gap-2">'),
            ('bg-white/90 py-3 text-sm font-bold text-slate-700', 'bg-white/90 py-2 text-sm font-bold text-slate-700'),
            ('<p className="mt-2 text-center text-[9px] font-semibold text-slate-500">{approachLong === approachTargetDistance', '<p className="mt-1 text-center text-[9px] font-semibold text-slate-500">{approachLong === approachTargetDistance'),
            ('<div className="my-4 h-px bg-slate-200" />', '<div className="my-2.5 h-px bg-slate-200" />'),
            ('<div className="mt-2 grid grid-cols-2 gap-2"><button onClick={() => setApproachLateralDirection', '<div className="mt-1.5 grid grid-cols-2 gap-2"><button onClick={() => setApproachLateralDirection'),
            ('rounded-xl border py-2.5 text-sm font-bold', 'rounded-xl border py-2 text-sm font-bold'),
            ('<div className="mt-3 grid grid-cols-[1fr_1fr_1.25fr_1fr_1fr] gap-2">', '<div className="mt-2 grid grid-cols-[1fr_1fr_1.25fr_1fr_1fr] gap-2">'),
            ('bg-white/90 py-3 font-bold text-slate-700', 'bg-white/90 py-2 font-bold text-slate-700'),
            ('<div className="mt-4 flex items-center justify-between rounded-xl bg-slate-100 px-3 py-2.5">', '<div className="mt-2.5 flex items-center justify-between rounded-xl bg-slate-100 px-3 py-2">'),
            ('</div></div><button disabled={isSubmitting} onClick={recordApproach} className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-4', '</div></div><button disabled={isSubmitting} onClick={recordApproach} className="mt-2 flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-3'),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit(f'Target not found: {old[:120]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git commit -m "Compact approach input without removing controls"
          git push
