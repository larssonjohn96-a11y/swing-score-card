name: Reverse Learn progression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverse-learn-path.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Reverse progression and add section jump menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/learn.tsx')
          s = p.read_text()

          s = s.replace(
            '  const [completed, setCompleted] = useState<string[]>([]);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);',
            '  const [completed, setCompleted] = useState<string[]>([]);\n  const [sectionMenuOpen, setSectionMenuOpen] = useState(false);\n  const selectedRef = useRef<HTMLButtonElement | null>(null);'
          )

          marker = '  useEffect(() => {\n    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ selectedId, completed })); } catch { /* ignore */ }\n  }, [selectedId, completed]);'
          insert = marker + '''\n\n  useEffect(() => {\n    const timer = window.setTimeout(() => selectedRef.current?.scrollIntoView({ behavior: "auto", block: "center" }), 80);\n    return () => window.clearTimeout(timer);\n  }, []);'''
          if marker not in s:
            raise SystemExit('storage effect marker not found')
          s = s.replace(marker, insert)

          old_button = '<button type="button" onClick={() => document.getElementById("learn-sections")?.scrollIntoView({ behavior: "smooth" })} className="flex items-center gap-2 rounded-2xl border border-white/15 bg-white/[.06] px-3 py-2 text-xs font-semibold text-white/80 backdrop-blur-xl"><Map className="h-4 w-4" /> Sektioner</button>'
          new_button = '<button type="button" onClick={() => setSectionMenuOpen((open) => !open)} className="flex items-center gap-2 rounded-2xl border border-white/15 bg-white/[.06] px-3 py-2 text-xs font-semibold text-white/80 backdrop-blur-xl"><Map className="h-4 w-4" /> Sektioner</button>'
          if old_button not in s:
            raise SystemExit('section button not found')
          s = s.replace(old_button, new_button)

          old_after_header = '''        </header>\n\n        <section className="mt-5 flex items-center gap-3">'''
          new_after_header = '''        </header>\n\n        {sectionMenuOpen ? (\n          <div className="fixed left-1/2 top-[72px] z-50 w-[calc(100%-24px)] max-w-md -translate-x-1/2 rounded-[26px] border border-white/15 bg-[#303436]/96 p-3 shadow-[0_24px_60px_-24px_rgba(0,0,0,.9)] backdrop-blur-3xl">\n            <div className="grid grid-cols-2 gap-2">\n              {SECTIONS.map((section) => {\n                const tone = TONE[section.tone];\n                return <button key={section.id} type="button" onClick={() => {\n                  setSectionMenuOpen(false);\n                  window.setTimeout(() => document.getElementById(`learn-section-${section.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 20);\n                }} className="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/[.05] px-3 py-3 text-left text-xs font-semibold text-white/85 active:scale-[.98]">\n                  <span className={`h-2.5 w-2.5 shrink-0 rounded-full ${tone.dot}`} />\n                  <span>{section.title}</span>\n                </button>;\n              })}\n            </div>\n          </div>\n        ) : null}\n\n        <section className="mt-5 flex items-center gap-3">'''
          if old_after_header not in s:
            raise SystemExit('header insertion point not found')
          s = s.replace(old_after_header, new_after_header)

          s = s.replace('{SECTIONS.map((section) => {', '{[...SECTIONS].reverse().map((section) => {', 1)
          s = s.replace('<section key={section.id}>', '<section key={section.id} id={`learn-section-${section.id}`} className="scroll-mt-28">', 1)
          s = s.replace('{[0, 1, 2, 3].map((row) => {', '{[3, 2, 1, 0].map((row) => {', 1)

          p.write_text(s)
          PY
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/learn.tsx
          git commit -m 'Make Learn progression climb upward'
          git push
