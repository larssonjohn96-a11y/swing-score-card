name: Move Learn into More
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-learn-to-more.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Move Learn into More menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/bottom-nav.tsx')
          s=p.read_text()
          s=s.replace('''const RIGHT_TABS = [\n  { to: "/learn", label: "Learn", icon: GraduationCap, exact: false },\n] as const;\n\n''','')
          s=s.replace('''const MORE_LINKS = [\n  { to: "/utveckling", label: "Analys", description: "Utveckling, nivåer och spelarprofil.", icon: Gauge, tone: "neutral" },''','''const MORE_LINKS = [\n  { to: "/learn", label: "Lär dig", description: "Lektioner, golfkunskap och interaktiva quiz.", icon: GraduationCap, tone: "learn" },\n  { to: "/utveckling", label: "Analys", description: "Utveckling, nivåer och spelarprofil.", icon: Gauge, tone: "neutral" },''')
          s=s.replace('''  if (tone === "gold") return { card: "border-amber-500/25 bg-amber-500/[.06]", icon: "bg-amber-500/15 text-amber-600" };\n  if (tone === "flag") return { card: "border-red-500/20 bg-gradient-to-r from-blue-500/[.05] via-card to-red-500/[.05]", icon: "bg-slate-950 text-white" };''','''  if (tone === "gold") return { card: "border-amber-500/25 bg-amber-500/[.06]", icon: "bg-amber-500/15 text-amber-600" };\n  if (tone === "learn") return { card: "border-emerald-500/25 bg-emerald-500/[.06]", icon: "bg-emerald-500/15 text-emerald-600" };\n  if (tone === "flag") return { card: "border-red-500/20 bg-gradient-to-r from-blue-500/[.05] via-card to-red-500/[.05]", icon: "bg-slate-950 text-white" };''')
          s=s.replace('''      <div className="mx-auto grid h-[68px] w-full grid-cols-[1fr_1fr_74px_1fr_1fr] items-center gap-0.5 px-2.5 py-1.5">''','''      <div className="mx-auto grid h-[68px] w-full grid-cols-[1fr_1fr_74px_1fr] items-center gap-0.5 px-2.5 py-1.5">''')
          s=s.replace('''        {RIGHT_TABS.map((tab) => <NavLink key={tab.to} tab={tab} active={pathname.startsWith(tab.to)} />)}\n\n''','')
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/bottom-nav.tsx
          git commit -m "Move Learn into More menu" || exit 0
          git push