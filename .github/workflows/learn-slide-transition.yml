name: Learn slide transition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learn-slide-transition.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Add right-slide lesson transition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/learn.tsx')
          s = p.read_text()

          s = s.replace(
            '  const [questionStats, setQuestionStats] = useState<Record<string, { correct: number; wrong: number; lastSeen: number }>>({});\n  const selectedRef',
            '  const [questionStats, setQuestionStats] = useState<Record<string, { correct: number; wrong: number; lastSeen: number }>>({});\n  const [lessonVisible, setLessonVisible] = useState(false);\n  const selectedRef'
          )

          old_start = '''  function startLesson(lessonId = selected.id) {\n    const lesson = ALL_LESSONS.find((item) => item.id === lessonId) ?? selected;\n    const questions = questionsForLesson(lesson.id, lesson.section.id, 3);\n    setSelectedId(lesson.id);\n    setSectionMenuOpen(false);\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });\n  }'''
          new_start = '''  function startLesson(lessonId = selected.id) {\n    const lesson = ALL_LESSONS.find((item) => item.id === lessonId) ?? selected;\n    const questions = questionsForLesson(lesson.id, lesson.section.id, 3);\n    setSelectedId(lesson.id);\n    setSectionMenuOpen(false);\n    setLessonVisible(false);\n    setSession({ mode: "lesson", questions, index: -1, correct: 0 });\n    window.requestAnimationFrame(() => window.requestAnimationFrame(() => setLessonVisible(true)));\n  }\n\n  function closeLesson() {\n    setLessonVisible(false);\n    window.setTimeout(() => setSession(null), 280);\n  }'''
          if old_start not in s:
              raise SystemExit('updated startLesson block not found')
          s = s.replace(old_start, new_start)

          old_quick = '    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });'
          new_quick = '    setLessonVisible(false);\n    setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });\n    window.requestAnimationFrame(() => window.requestAnimationFrame(() => setLessonVisible(true)));'
          if old_quick not in s:
              raise SystemExit('quick session opener not found')
          s = s.replace(old_quick, new_quick)

          s = s.replace('    setSession(null);\n  }\n\n  function nextLesson()', '    setLessonVisible(false);\n    window.setTimeout(() => setSession(null), 280);\n  }\n\n  function nextLesson()', 1)

          old_main = '<main className="min-h-screen bg-[#242728] pb-32 text-white">'
          new_main = '<main className="min-h-screen overflow-x-hidden bg-[#242728] pb-32 text-white">'
          s = s.replace(old_main, new_main, 1)

          old_content = '<div className="mx-auto w-full max-w-md px-4 pt-5">'
          new_content = '<div className={`mx-auto w-full max-w-md px-4 pt-5 transition-transform duration-300 ease-[cubic-bezier(.22,.8,.24,1)] ${session && lessonVisible ? "-translate-x-[22%]" : "translate-x-0"}`}> '
          if old_content not in s:
              raise SystemExit('main content wrapper not found')
          s = s.replace(old_content, new_content, 1)

          old_overlay = '<div className="fixed inset-0 z-[100] overflow-y-auto bg-[#202324] text-white">'
          new_overlay = '<div className={`fixed inset-0 z-[100] overflow-y-auto bg-[#202324] text-white transition-transform duration-300 ease-[cubic-bezier(.22,.8,.24,1)] ${lessonVisible ? "translate-x-0" : "translate-x-full"}`}> '
          if old_overlay not in s:
              raise SystemExit('lesson overlay not found')
          s = s.replace(old_overlay, new_overlay, 1)

          s = s.replace('onClick={() => setSession(null)} className="flex h-10 w-10', 'onClick={closeLesson} className="flex h-10 w-10', 1)

          p.write_text(s)
          PY
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/learn.tsx
          git commit -m 'Slide Learn lessons in from the right'
          git push
