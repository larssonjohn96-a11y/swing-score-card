name: Simplify chipping hole copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-chipping-hole-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Update chipping copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/match.tsx')
          s = p.read_text()
          s = s.replace(
            '{ id: "closest", title: "Closest to the Pin", description: "Ett slag mot flaggan. Poäng efter avståndszon – högst poäng vinner hålet." },',
            '{ id: "closest", title: "Closest to the Pin", description: "Ett slag mot flaggan. Närmast flaggan vinner hålet." },'
          )
          s = s.replace(
            'return { eyebrow: band.label, title: `${distance} m`, detail: `${band.range} · samma avstånd för båda · högst poäng vinner hålet${suffix}` };',
            'return { eyebrow: band.label, title: `${distance} m`, detail: `${distance} m från flaggan · närmast flaggan vinner${suffix}` };'
          )
          p.write_text(s)

          p = Path('src/lib/chip-match.ts')
          s = p.read_text().replace('{ points: 0, label: "Över 5 m" },', '{ points: 0, label: "Utanför 5 m" },')
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/lib/chip-match.ts
          git commit -m "Simplify chipping hole copy" || exit 0
          git push
