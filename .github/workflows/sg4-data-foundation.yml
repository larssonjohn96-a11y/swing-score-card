name: SG4 Data Foundation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sg4-data-foundation.yml'
permissions:
  contents: write
jobs:
  build-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Write shot-bank foundation
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
          'docs/sg4-shot-contract.md': r'''# SG4 Shot Contract v1

This contract is the durable boundary between golf activity UI and SG4 intelligence.

## Invariants

1. `shot_events` is append-only. A recorded shot is never updated or deleted.
2. Corrections are compensating events: `shot_voided` references the original `event_id`.
3. `event_id` is globally unique and is the idempotency key for retries/offline sync.
4. `session_id` groups attempts that belong to one test, training session, game or match.
5. `sequence` is stable within a session and describes the original attempt order.
6. Rating time is deterministic: weighting uses `played_at` plus an explicit `as_of`. `recorded_at` is audit/transport metadata only.
7. Product UI must never interpret raw shot events directly. UI consumes profile/service APIs.
8. Eligibility is versioned independently from the raw schema. A shot can be stored while being excluded from HCP/rating.
9. Raw events are the source material. Derived profiles/snapshots can always be rebuilt.

## Event envelope

Every v1 event contains `event_id`, `event_type`, `schema_version`, nullable `user_id`, `session_id`, `sequence`, `played_at`, `recorded_at`, stable machine-readable `source`, `activity_type`, `skill`, a typed `payload`, and extensible `context`.

`shot_voided` additionally references `target_event_id` and stores a human/debuggable `reason`. The original event remains untouched.

## Session envelope

A session has `session_id`, nullable `user_id`, `source`, `activity_type`, `started_at`, nullable `completed_at`, `status` (`started`, `completed`, `abandoned`), `schema_version`, and extensible metadata.

Eligibility may depend on session state. For example, v1 pooled putting requires a completed session and an independent/comparable attempt.

## Putting v1

Putting events use metres as the canonical distance unit. Normal independent attempts can feed the putting profile. Progression/streak attempts are valuable history but are explicitly ineligible for pooled HCP/rating because reaching later attempts depends on earlier outcomes.
''',
          'src/lib/shot-bank/types.ts': r'''export type JsonValue = string | number | boolean | null | JsonValue[] | { [key: string]: JsonValue };

export const SHOT_SCHEMA_VERSION = 1 as const;

export type ShotActivityType = "test" | "training" | "match" | "game" | "other";
export type ShotSkill = "putting" | "chip" | "approach" | "bunker" | "driver" | "speed";
export type ShotSessionStatus = "started" | "completed" | "abandoned";

export type ShotContext = {
  /** Explicit opt-out. Missing means eligibility is decided by the skill projector. */
  hcp_eligible?: boolean;
  /** Independent attempts may be pooled across compatible sources. */
  independent_attempt?: boolean;
  /** Progression/streak formats are stored but not pooled for HCP. */
  progression_format?: boolean;
  format_id?: string;
  direction?: string;
  green_type?: string;
  [key: string]: JsonValue | undefined;
};

export type PuttingShotPayload = {
  kind: "putting";
  distance_m: number;
  first_putt_holed: boolean;
  strokes_to_hole?: number;
};

/** Future skills can extend the payload without changing the stable event envelope. */
export type GenericShotPayload = {
  kind: Exclude<ShotSkill, "putting">;
  data: { [key: string]: JsonValue };
};

export type ShotPayload = PuttingShotPayload | GenericShotPayload;

export type ShotRecordedEvent = {
  event_id: string;
  event_type: "shot_recorded";
  schema_version: typeof SHOT_SCHEMA_VERSION;
  user_id: string | null;
  session_id: string;
  sequence: number;
  played_at: string;
  recorded_at: string;
  source: string;
  activity_type: ShotActivityType;
  skill: ShotSkill;
  payload: ShotPayload;
  context: ShotContext;
};

export type ShotVoidedEvent = {
  event_id: string;
  event_type: "shot_voided";
  schema_version: typeof SHOT_SCHEMA_VERSION;
  user_id: string | null;
  session_id: string;
  sequence: number;
  played_at: string;
  recorded_at: string;
  source: string;
  activity_type: ShotActivityType;
  skill: ShotSkill;
  payload: { kind: "void" };
  context: ShotContext;
  target_event_id: string;
  reason: string;
};

export type ShotEvent = ShotRecordedEvent | ShotVoidedEvent;

export type ShotSession = {
  session_id: string;
  schema_version: typeof SHOT_SCHEMA_VERSION;
  user_id: string | null;
  source: string;
  activity_type: ShotActivityType;
  started_at: string;
  completed_at: string | null;
  status: ShotSessionStatus;
  metadata: { [key: string]: JsonValue };
};

export function recordedShotEventId(sessionId: string, sequence: number) {
  return `${sessionId}:shot:${sequence}`;
}

export function voidShotEventId(targetEventId: string, nonce: string) {
  return `${targetEventId}:void:${nonce}`;
}
''',
          'src/lib/shot-bank/store.ts': r'''import { supabase } from "@/integrations/supabase/client";
import type { ShotEvent, ShotSession } from "./types";

const EVENT_CACHE_KEY = "sg4.shot-bank.events.v1";
const SESSION_CACHE_KEY = "sg4.shot-bank.sessions.v1";
const OUTBOX_KEY = "sg4.shot-bank.outbox.v1";

export type ShotStorage = Pick<Storage, "getItem" | "setItem" | "removeItem">;
export type ShotSyncState = "pending" | "synced" | "failed";

type OutboxItem = {
  key: string;
  kind: "session" | "event";
  status: ShotSyncState;
  attempts: number;
  last_error?: string;
  data: ShotSession | ShotEvent;
};

export type ShotSyncStatus = {
  pending: number;
  failed: number;
  synced: number;
  state: "synced" | "pending" | "failed";
};

const listeners = new Set<(status: ShotSyncStatus) => void>();
let syncPromise: Promise<void> | null = null;
let onlineHandlerInstalled = false;

function browserStorage(): ShotStorage | null {
  return typeof window === "undefined" ? null : window.localStorage;
}

function parseArray<T>(storage: ShotStorage | null, key: string): T[] {
  if (!storage) return [];
  try {
    const parsed = JSON.parse(storage.getItem(key) ?? "[]") as unknown;
    return Array.isArray(parsed) ? (parsed as T[]) : [];
  } catch {
    return [];
  }
}

function writeArray<T>(storage: ShotStorage | null, key: string, value: T[]) {
  storage?.setItem(key, JSON.stringify(value));
}

function loadOutbox(storage: ShotStorage | null = browserStorage()) {
  return parseArray<OutboxItem>(storage, OUTBOX_KEY);
}

function saveOutbox(items: OutboxItem[], storage: ShotStorage | null = browserStorage()) {
  // Keep synced entries for diagnostics/idempotency, but cap local transport history.
  const synced = items.filter((item) => item.status === "synced").slice(-300);
  const active = items.filter((item) => item.status !== "synced");
  writeArray(storage, OUTBOX_KEY, [...synced, ...active]);
  emit(storage);
}

function emit(storage: ShotStorage | null = browserStorage()) {
  const status = getShotSyncStatus(storage);
  listeners.forEach((listener) => listener(status));
}

export function loadLocalShotEvents(storage: ShotStorage | null = browserStorage()): ShotEvent[] {
  return parseArray<ShotEvent>(storage, EVENT_CACHE_KEY);
}

export function loadLocalShotSessions(storage: ShotStorage | null = browserStorage()): ShotSession[] {
  return parseArray<ShotSession>(storage, SESSION_CACHE_KEY);
}

export function persistShotSessionLocally(session: ShotSession, storage: ShotStorage | null = browserStorage()) {
  if (!storage) return session;
  const sessions = loadLocalShotSessions(storage);
  const existing = sessions.find((row) => row.session_id === session.session_id);
  if (!existing) writeArray(storage, SESSION_CACHE_KEY, [...sessions, session]);
  enqueue({ key: `session:${session.session_id}`, kind: "session", status: "pending", attempts: 0, data: session }, storage);
  return existing ?? session;
}

export function persistShotEventLocally(event: ShotEvent, storage: ShotStorage | null = browserStorage()) {
  if (!storage) return event;
  const events = loadLocalShotEvents(storage);
  const existing = events.find((row) => row.event_id === event.event_id);
  if (existing) return existing;
  writeArray(storage, EVENT_CACHE_KEY, [...events, event]);
  enqueue({ key: `event:${event.event_id}`, kind: "event", status: "pending", attempts: 0, data: event }, storage);
  return event;
}

function enqueue(item: OutboxItem, storage: ShotStorage) {
  const outbox = loadOutbox(storage);
  if (outbox.some((row) => row.key === item.key)) return;
  saveOutbox([...outbox, item], storage);
}

export function getShotSyncStatus(storage: ShotStorage | null = browserStorage()): ShotSyncStatus {
  const outbox = loadOutbox(storage);
  const pending = outbox.filter((item) => item.status === "pending").length;
  const failed = outbox.filter((item) => item.status === "failed").length;
  const synced = outbox.filter((item) => item.status === "synced").length;
  return { pending, failed, synced, state: failed ? "failed" : pending ? "pending" : "synced" };
}

export function subscribeShotSyncStatus(listener: (status: ShotSyncStatus) => void) {
  listeners.add(listener);
  listener(getShotSyncStatus());
  return () => listeners.delete(listener);
}

export function recordShotSession(session: ShotSession) {
  persistShotSessionLocally(session);
  scheduleShotSync();
  return session;
}

export function recordShot(event: ShotEvent) {
  const stored = persistShotEventLocally(event);
  scheduleShotSync();
  return stored;
}

function scheduleShotSync() {
  if (typeof window === "undefined") return;
  queueMicrotask(() => void syncShotOutbox());
}

function schemaNotReady(error: { code?: string; message?: string } | null) {
  if (!error) return false;
  return error.code === "42P01" || error.code === "PGRST205" || error.message?.includes("shot_events") || error.message?.includes("shot_sessions");
}

async function syncOne(item: OutboxItem, userId: string) {
  if (item.kind === "session") {
    const session = item.data as ShotSession;
    // Generated Database types are regenerated after the migration is applied.
    // @ts-expect-error shot_sessions is introduced by the migration in this change.
    return supabase.from("shot_sessions").upsert({
      session_id: session.session_id,
      user_id: userId,
      source: session.source,
      activity_type: session.activity_type,
      started_at: session.started_at,
      completed_at: session.completed_at,
      status: session.status,
      schema_version: session.schema_version,
      metadata: session.metadata,
    }, { onConflict: "session_id", ignoreDuplicates: true });
  }

  const event = item.data as ShotEvent;
  // @ts-expect-error shot_events is introduced by the migration in this change.
  return supabase.from("shot_events").upsert({
    event_id: event.event_id,
    user_id: userId,
    event_type: event.event_type,
    schema_version: event.schema_version,
    session_id: event.session_id,
    sequence: event.sequence,
    played_at: event.played_at,
    recorded_at: event.recorded_at,
    source: event.source,
    activity_type: event.activity_type,
    skill: event.skill,
    payload: event.payload,
    context: event.context,
    target_event_id: event.event_type === "shot_voided" ? event.target_event_id : null,
    reason: event.event_type === "shot_voided" ? event.reason : null,
  }, { onConflict: "event_id", ignoreDuplicates: true });
}

export async function syncShotOutbox() {
  if (syncPromise) return syncPromise;
  if (typeof window === "undefined" || (typeof navigator !== "undefined" && navigator.onLine === false)) return;

  syncPromise = (async () => {
    const { data } = await supabase.auth.getUser();
    const user = data.user;
    if (!user) return;

    let outbox = loadOutbox();
    const pending = [
      ...outbox.filter((item) => item.status === "pending" && item.kind === "session"),
      ...outbox.filter((item) => item.status === "pending" && item.kind === "event"),
    ];

    for (const item of pending) {
      const result = await syncOne(item, user.id);
      outbox = loadOutbox();
      const index = outbox.findIndex((row) => row.key === item.key);
      if (index < 0) continue;
      const error = result.error as { code?: string; message?: string } | null;
      if (!error) {
        outbox[index] = { ...outbox[index], status: "synced", attempts: outbox[index].attempts + 1, last_error: undefined };
      } else if (schemaNotReady(error)) {
        // Migration may not be deployed yet. Keep durable pending data without claiming data loss.
        outbox[index] = { ...outbox[index], attempts: outbox[index].attempts + 1, last_error: error.message };
      } else {
        outbox[index] = { ...outbox[index], status: "failed", attempts: outbox[index].attempts + 1, last_error: error.message };
      }
      saveOutbox(outbox);
    }
  })().finally(() => { syncPromise = null; });

  return syncPromise;
}

export function retryShotSync() {
  const outbox = loadOutbox().map((item) => item.status === "failed" ? { ...item, status: "pending" as const, last_error: undefined } : item);
  saveOutbox(outbox);
  return syncShotOutbox();
}

export function startShotSync() {
  if (typeof window === "undefined") return () => undefined;
  void syncShotOutbox();
  if (!onlineHandlerInstalled) {
    window.addEventListener("online", syncShotOutbox);
    onlineHandlerInstalled = true;
  }
  return () => undefined;
}
''',
          'src/lib/shot-bank/putting.ts': r'''import type { PuttingShotPayload, ShotEvent, ShotRecordedEvent, ShotSession } from "./types";
import { loadLocalShotEvents, loadLocalShotSessions } from "./store";

export const PUTTING_ELIGIBILITY_VERSION = 1;
export const PUTTING_SCORING_VERSION = 1;
export const PUTTING_RECENT_SAMPLE = 200;

export type PuttingBucket = {
  distance_m: number;
  label: string;
  attempts: number;
  made: number;
  make_rate: number;
  rating: number;
};

export type PuttingProfile = {
  as_of: string;
  eligibility_version: number;
  scoring_version: number;
  eligible_attempts: number;
  rating: number | null;
  confidence: number;
  stale_days: number | null;
  buckets: PuttingBucket[];
};

function parseTime(value: string) {
  const ms = Date.parse(value);
  if (!Number.isFinite(ms)) throw new Error(`Invalid ISO timestamp: ${value}`);
  return ms;
}

export function canonicalPuttingDistance(distanceM: number) {
  if (!Number.isFinite(distanceM) || distanceM <= 0) throw new Error("Putting distance must be positive");
  return Math.round(distanceM * 10) / 10;
}

export function canonicalPuttingBucket(distanceM: number) {
  const distance = canonicalPuttingDistance(distanceM);
  return `${distance.toFixed(1)}m`;
}

export function puttingRatingContribution(event: ShotRecordedEvent) {
  if (event.payload.kind !== "putting") return 0;
  return event.payload.first_putt_holed ? 1 : 0;
}

export function isPuttingHcpEligible(event: ShotRecordedEvent, session?: ShotSession) {
  if (event.skill !== "putting" || event.payload.kind !== "putting") return false;
  if (!session || session.status !== "completed") return false;
  if (event.context.hcp_eligible === false) return false;
  if (event.context.independent_attempt === false) return false;
  if (event.context.progression_format === true) return false;
  return true;
}

function uniqueEvents(events: ShotEvent[]) {
  const map = new Map<string, ShotEvent>();
  for (const event of events) if (!map.has(event.event_id)) map.set(event.event_id, event);
  return [...map.values()];
}

export function replayPuttingProfile(events: ShotEvent[], sessions: ShotSession[], asOf: string): PuttingProfile {
  const asOfMs = parseTime(asOf);
  const sessionMap = new Map(sessions.map((session) => [session.session_id, session]));
  const all = uniqueEvents(events).filter((event) => parseTime(event.played_at) <= asOfMs);
  const voided = new Set(all.filter((event) => event.event_type === "shot_voided").map((event) => event.target_event_id));
  const eligible = all
    .filter((event): event is ShotRecordedEvent => event.event_type === "shot_recorded")
    .filter((event) => !voided.has(event.event_id))
    .filter((event) => isPuttingHcpEligible(event, sessionMap.get(event.session_id)))
    .sort((a, b) => parseTime(a.played_at) - parseTime(b.played_at) || a.event_id.localeCompare(b.event_id))
    .slice(-PUTTING_RECENT_SAMPLE);

  const grouped = new Map<number, { attempts: number; made: number }>();
  for (const event of eligible) {
    const payload = event.payload as PuttingShotPayload;
    const distance = canonicalPuttingDistance(payload.distance_m);
    const row = grouped.get(distance) ?? { attempts: 0, made: 0 };
    row.attempts += 1;
    row.made += puttingRatingContribution(event);
    grouped.set(distance, row);
  }

  const buckets = [...grouped.entries()].map(([distance_m, row]) => {
    const makeRate = row.attempts ? row.made / row.attempts : 0;
    return {
      distance_m,
      label: canonicalPuttingBucket(distance_m),
      attempts: row.attempts,
      made: row.made,
      make_rate: makeRate,
      rating: makeRate * 100,
    };
  }).sort((a, b) => a.distance_m - b.distance_m);

  const made = eligible.reduce((sum, event) => sum + puttingRatingContribution(event), 0);
  const rating = eligible.length ? (made / eligible.length) * 100 : null;
  const latestMs = eligible.length ? Math.max(...eligible.map((event) => parseTime(event.played_at))) : null;
  const staleDays = latestMs === null ? null : Math.max(0, (asOfMs - latestMs) / 86_400_000);
  const sampleConfidence = Math.min(1, eligible.length / 100);
  const freshness = staleDays === null ? 0 : staleDays <= 30 ? 1 : staleDays <= 180 ? 1 - ((staleDays - 30) / 150) * 0.4 : 0.6;

  return {
    as_of: asOf,
    eligibility_version: PUTTING_ELIGIBILITY_VERSION,
    scoring_version: PUTTING_SCORING_VERSION,
    eligible_attempts: eligible.length,
    rating,
    confidence: sampleConfidence * freshness,
    stale_days: staleDays,
    buckets,
  };
}

/** UI/service boundary: components can read the profile, never raw events. */
export function getLocalPuttingProfile(asOf: string) {
  return replayPuttingProfile(loadLocalShotEvents(), loadLocalShotSessions(), asOf);
}
''',
          'src/lib/shot-bank/record-putting.ts': r'''import { recordShot, recordShotSession } from "./store";
import { recordedShotEventId, SHOT_SCHEMA_VERSION, type ShotActivityType, type ShotContext } from "./types";

export type PuttingAttemptInput = {
  distance_m: number;
  first_putt_holed: boolean;
  strokes_to_hole?: number;
  context?: ShotContext;
};

export type RecordPuttingSessionInput = {
  session_id: string;
  source: string;
  activity_type: ShotActivityType;
  played_at: string;
  attempts: PuttingAttemptInput[];
  session_metadata?: Record<string, string | number | boolean | null>;
  default_context?: ShotContext;
};

export function recordPuttingSession(input: RecordPuttingSessionInput) {
  const recordedAt = new Date().toISOString();
  recordShotSession({
    session_id: input.session_id,
    schema_version: SHOT_SCHEMA_VERSION,
    user_id: null,
    source: input.source,
    activity_type: input.activity_type,
    started_at: input.played_at,
    completed_at: input.played_at,
    status: "completed",
    metadata: input.session_metadata ?? {},
  });

  input.attempts.forEach((attempt, index) => {
    const sequence = index + 1;
    recordShot({
      event_id: recordedShotEventId(input.session_id, sequence),
      event_type: "shot_recorded",
      schema_version: SHOT_SCHEMA_VERSION,
      user_id: null,
      session_id: input.session_id,
      sequence,
      played_at: input.played_at,
      recorded_at: recordedAt,
      source: input.source,
      activity_type: input.activity_type,
      skill: "putting",
      payload: {
        kind: "putting",
        distance_m: attempt.distance_m,
        first_putt_holed: attempt.first_putt_holed,
        ...(attempt.strokes_to_hole !== undefined ? { strokes_to_hole: attempt.strokes_to_hole } : {}),
      },
      context: { ...input.default_context, ...attempt.context },
    });
  });
}
''',
