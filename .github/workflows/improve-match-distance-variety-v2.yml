name: Improve match distance variety v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-match-distance-variety-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch generators and test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lib/putting-match.ts')
          s = p.read_text()
          start = s.index('export function generatePuttingMatchDistances')
          end = s.index('\nexport function formatPuttingDistance', start)
          s = s[:start] + '''export function generatePuttingMatchDistances(length: PuttingMatchLength): number[] {
            const bandOrder = length === 3 ? [0, 1, 2] : length === 5 ? [0, 1, 2, 0, 2] : [0, 1, 2, 1, 0, 1, 2];
            const orderedBandIndexes = Math.random() < 0.5 ? bandOrder : bandOrder.map((index) => 2 - index);
            const distances: number[] = [];
            const minGap = 5;
            for (const bandIndex of orderedBandIndexes) {
              const band = PUTTING_DISTANCE_BANDS[bandIndex];
              const previous = distances.at(-1);
              const all = Array.from({ length: band.max - band.min + 1 }, (_, index) => band.min + index);
              const unused = all.filter((distance) => !distances.includes(distance));
              const pool = unused.length ? unused : all;
              const varied = previous === undefined ? pool : pool.filter((distance) => Math.abs(distance - previous) >= minGap);
              const allowedDistances = varied.length ? varied : pool;
              distances.push(selectNextEngineDistance({ skill: "putting", objective: "balanced", min: band.min, max: band.max, previousDistance: previous, allowedDistances }));
            }
            return distances;
          }
''' + s[end:]
          p.write_text(s)

          p = Path('src/lib/chip-match.ts')
          s = p.read_text()
          start = s.index('export function generateChipMatchDistances')
          s = s[:start] + '''export function generateChipMatchDistances(length: ChipMatchLength): number[] {
            const bandOrder = length === 3 ? [0, 1, 2] : length === 5 ? [0, 1, 2, 0, 2] : [0, 1, 2, 1, 0, 1, 2];
            const orderedBandIndexes = Math.random() < 0.5 ? bandOrder : bandOrder.map((index) => 2 - index);
            const distances: number[] = [];
            const minGap = 6;
            for (const bandIndex of orderedBandIndexes) {
              const band = CHIP_DISTANCE_BANDS[bandIndex];
              const previous = distances.at(-1);
              const all = Array.from({ length: band.max - band.min + 1 }, (_, index) => band.min + index);
              const unused = all.filter((distance) => !distances.includes(distance));
              const pool = unused.length ? unused : all;
              const varied = previous === undefined ? pool : pool.filter((distance) => Math.abs(distance - previous) >= minGap);
              const allowedDistances = varied.length ? varied : pool;
              distances.push(selectNextEngineDistance({ skill: "chip", objective: "balanced", min: band.min, max: band.max, previousDistance: previous, allowedDistances }));
            }
            return distances;
          }
'''
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/putting-match.ts src/lib/chip-match.ts
          git commit -m "Prioritize distance variety in putting and chipping matches"
          git push
