name: Rename approach and tee options
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-approach-tee-options.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Rename approach and tee options
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/match.tsx')
          s = p.read_text()
          reps = {
            '{ id: "approach", title: "Närmast flaggan", subtitle: "Inspel", description: "Slå mot samma mål från varierade avstånd. Närmast flaggan vinner." }': '{ id: "approach", title: "Inspel", subtitle: "Järn & wedge · närmast flaggan", description: "Slå mot samma mål från varierade avstånd. Närmast flaggan vinner." }',
            '{ id: "off-the-tee", title: "Fairway", subtitle: "Driver", description: "Längsta godkända drive inom en 30 meter bred fairway vinner." }': '{ id: "off-the-tee", title: "Utslag", subtitle: "Driver · fairway", description: "Längsta godkända drive inom en 30 meter bred fairway vinner." }',
            '{ id: "fairway", title: "Fairway", description:': '{ id: "fairway", title: "Utslag", description:',
            '{ id: "closest", title: "Närmast flaggan", description:': '{ id: "closest", title: "Inspel", description:',
            'eyebrow: "Närmast flaggan"': 'eyebrow: "Inspel"',
            'title: "Fairway", detail:': 'title: "Utslag", detail:',
            'Inspel · Närmast flaggan': 'Inspel · Järn & wedge',
          }
          for old, new in reps.items(): s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()
          reps = {
            '{ id: "off-the-tee", title: "Fairway", sub: "Driver" }': '{ id: "off-the-tee", title: "Utslag", sub: "Driver · fairway" }',
            '{ id: "approach", title: "Närmast flaggan", sub: "Inspel" }': '{ id: "approach", title: "Inspel", sub: "Järn & wedge · närmast flaggan" }',
            'title: "Fairway", detail:': 'title: "Utslag", detail:',
          }
          for old, new in reps.items(): s = s.replace(old, new)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git commit -m "Rename approach and tee match options"
          git push
