name: Fix bot selector fixed CTA v3

on:
  push:
    paths:
      - '.github/workflows/fix-bot-selector-fixed-cta-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch bot selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()

          s = s.replace('  country: string;\n  flag: string;\n', '')
          s = s.replace('country, flag, ', '')
          s = s.replace('country: string; flag: string; ', '')
          s = re.sub(r', country: "[^"]*", flag: "[^"]*"', '', s)
          s = re.sub(r'\s*<span className="text-lg">\{bot\.flag\}</span>', '', s)
          s = re.sub(r'<span>\{bot\.country\}</span>', '', s)
          s = s.replace('items-center justify-between border-t border-slate-200/80 pt-2 text-[10px] font-semibold text-slate-500', 'items-center justify-end border-t border-slate-200/80 pt-2 text-[10px] font-semibold text-slate-500')

          # Replace the unique fixed CTA wrapper by locating the exact line containing the gradient.
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if 'bg-gradient-to-t from-white via-white/95 to-white/0' in line and 'Spela mot' not in line:
                  indent = line[:len(line)-len(line.lstrip())]
                  lines[i] = indent + '<div className="w-full bg-gradient-to-t from-white via-white/95 to-white/0 px-5 pb-[calc(env(safe-area-inset-bottom)+16px)] pt-8" style={{ position: "fixed", left: "50%", bottom: 0, transform: "translateX(-50%)", width: "100%", maxWidth: "28rem", zIndex: 80 }}>'
                  break
          s = '\n'.join(lines) + ('\n' if p.read_text().endswith('\n') else '')
          s = s.replace('step === "bot" ? "pt-6 pb-40"', 'step === "bot" ? "pt-6 pb-52"')
          s = s.replace('step === "bot" ? "pt-6 pb-44"', 'step === "bot" ? "pt-6 pb-52"')

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Fix sticky bot CTA and remove countries"
          git push
