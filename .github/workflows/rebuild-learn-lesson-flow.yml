name: Rebuild Learn lesson flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-learn-lesson-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Rebuild interactive teacher-led lesson flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/learn.tsx')
          s=p.read_text()
          s=s.replace('  Brain,\n', '  Brain,\n  Check,\n  Eye,\n  Lightbulb,\n  MessageCircle,\n')
          old='''  const [session, setSession] = useState<{ mode: "lesson" | "quick"; questions: LearnQuestion[]; index: number; selected?: number; correct: number } | null>(null);'''
          new='''  const [session, setSession] = useState<{ mode: "lesson" | "quick"; questions: LearnQuestion[]; index: number; selected?: number; correct: number; phase?: "hook" | "teach" | "quiz" | "finish"; reveal?: boolean } | null>(null);'''
          s=s.replace(old,new)
          old_func='''  function startLesson(lessonId = selected.id) {
    const lesson = ALL_LESSONS.find((item) => item.id === lessonId) ?? selected;
    const questions = questionsForLesson(lesson.id, lesson.section.id, 3);
    setSelectedId(lesson.id);
    setSectionMenuOpen(false);
    setLessonVisible(false);
    setSession({ mode: "lesson", questions, index: -1, correct: 0 });
    window.requestAnimationFrame(() => window.requestAnimationFrame(() => setLessonVisible(true)));
  }
'''
          new_func='''  function buildLessonQuestions(lesson: (typeof ALL_LESSONS)[number]) {
    const specific = questionsForLesson(lesson.id, lesson.section.id, 3);
    if (specific.length >= 2) return specific;
    const knowledge = knowledgeForLesson(lesson.id);
    if (!knowledge) return specific;
    const fallback: LearnQuestion[] = [
      {
        id: `${lesson.id}-core-check`, lessonId: lesson.id, sectionId: lesson.section.id, level: "recall",
        prompt: `Vilket påstående fångar huvudidén i “${lesson.title}”?`,
        options: [knowledge.core, "Det viktigaste är alltid att slå det mest aggressiva slaget.", "Det handlar främst om att slå bollen så långt som möjligt.", "Det påverkar inte beslut eller score på banan."],
        correct: 0,
        feedback: knowledge.core,
      },
      {
        id: `${lesson.id}-why-check`, lessonId: lesson.id, sectionId: lesson.section.id, level: "apply",
        prompt: `Varför är “${lesson.title}” relevant när du spelar?`,
        options: [knowledge.why, "Det gör att alla slag automatiskt blir raka.", "Det ersätter behovet av att välja mål och klubb.", "Det är bara ett begrepp utan praktisk betydelse."],
        correct: 0,
        feedback: knowledge.why,
      },
    ];
    return [...specific, ...fallback].slice(0, 3);
  }

  function startLesson(lessonId = selected.id) {
    const lesson = ALL_LESSONS.find((item) => item.id === lessonId) ?? selected;
    const questions = buildLessonQuestions(lesson);
    setSelectedId(lesson.id);
    setSectionMenuOpen(false);
    setLessonVisible(false);
    setSession({ mode: "lesson", questions, index: 0, correct: 0, phase: "hook", reveal: false });
    window.requestAnimationFrame(() => window.requestAnimationFrame(() => setLessonVisible(true)));
  }
'''
          if old_func not in s: raise SystemExit('startLesson block not found')
          s=s.replace(old_func,new_func)
          s=s.replace('setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0 });','setSession({ mode: "quick", questions: pool.slice(0, 5), index: 0, correct: 0, phase: "quiz" });')
          old_continue='''  function continueSession() {
    if (!session) return;
    if (session.index === -1) {
      if (session.questions.length === 0) { setSession(null); nextLesson(); return; }
      setSession({ ...session, index: 0 });
      return;
    }
    const nextIndex = session.index + 1;
    if (nextIndex < session.questions.length) {
      setSession({ ...session, index: nextIndex, selected: undefined });
      return;
    }
    if (session.mode === "lesson") {
      setCompleted((old) => old.includes(selectedId) ? old : [...old, selectedId]);
      const next = ALL_LESSONS[Math.min(selectedIndex + 1, ALL_LESSONS.length - 1)];
      setSelectedId(next.id);
      window.setTimeout(() => selectedRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
    }
    setLessonVisible(false);
    window.setTimeout(() => setSession(null), 280);
  }
'''
          new_continue='''  function continueSession() {
    if (!session) return;
    if (session.mode === "lesson") {
      if (session.phase === "hook") { setSession({ ...session, phase: "teach", reveal: false }); return; }
      if (session.phase === "teach") { setSession({ ...session, phase: "quiz", index: 0, selected: undefined }); return; }
      if (session.phase === "finish") {
        setCompleted((old) => old.includes(selectedId) ? old : [...old, selectedId]);
        const next = ALL_LESSONS[Math.min(selectedIndex + 1, ALL_LESSONS.length - 1)];
        setSelectedId(next.id);
        setLessonVisible(false);
        window.setTimeout(() => { setSession(null); selectedRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }); }, 280);
        return;
      }
    }
    const nextIndex = session.index + 1;
    if (nextIndex < session.questions.length) {
      setSession({ ...session, index: nextIndex, selected: undefined, phase: "quiz" });
      return;
    }
    if (session.mode === "lesson") { setSession({ ...session, phase: "finish", selected: undefined }); return; }
    setLessonVisible(false);
    window.setTimeout(() => setSession(null), 280);
  }
'''
          if old_continue not in s: raise SystemExit('continueSession block not found')
          s=s.replace(old_continue,new_continue)

          start=s.index('            {session.index === -1 ? (')
          end=s.index('          </div>\n        </div>\n      ) : null}', start)
          replacement='''            {session.mode === "lesson" && session.phase === "hook" ? (
              <div className="flex flex-1 flex-col py-6">
                <div className="flex-1 pt-5">
                  <div className="flex items-start gap-3">
                    <div className="flex h-16 w-16 shrink-0 items-center justify-center rounded-full border border-emerald-300/30 bg-gradient-to-br from-emerald-500/25 via-slate-700/80 to-slate-950 shadow-[0_0_30px_rgba(16,185,129,.12)]"><span className="text-3xl">🧑🏻‍🏫</span></div>
                    <div className="relative flex-1 rounded-[24px] border border-white/12 bg-white/[.06] p-4 before:absolute before:-left-2 before:top-6 before:h-4 before:w-4 before:rotate-45 before:border-b before:border-l before:border-white/10 before:bg-[#2c3031]">
                      <p className="text-[10px] font-black uppercase tracking-[.18em] text-emerald-300">Din coach</p>
                      <p className="mt-2 text-[18px] leading-relaxed text-white/92">{selected.coach}</p>
                    </div>
                  </div>
                  <div className="mt-8 rounded-[30px] border border-white/10 bg-gradient-to-br from-white/[.07] to-white/[.025] p-5">
                    <div className="flex items-center gap-3"><div className={`flex h-12 w-12 items-center justify-center rounded-2xl border bg-gradient-to-br ${TONE[selected.section.tone].tile}`}><selected.icon className="h-6 w-6" /></div><div><p className="text-[10px] font-black uppercase tracking-[.18em] text-white/35">Dagens mål</p><h2 className="font-display text-3xl leading-none">{selected.title}</h2></div></div>
                    <p className="mt-4 text-[15px] leading-relaxed text-white/65">{selected.description}</p>
                  </div>
                </div>
                <button type="button" onClick={continueSession} className="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-emerald-400 py-4 font-display text-xl text-slate-950">Lär mig <ChevronRight className="h-5 w-5" /></button>
              </div>
            ) : session.mode === "lesson" && session.phase === "teach" ? (
              <div className="flex flex-1 flex-col py-6">
                <div className="flex items-center gap-3 rounded-[24px] border border-white/10 bg-white/[.045] p-3.5"><div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-emerald-300/25 bg-emerald-400/10"><span className="text-2xl">🧑🏻‍🏫</span></div><div><p className="text-[10px] font-black uppercase tracking-[.18em] text-emerald-300">Kom ihåg en sak</p><p className="mt-1 text-sm text-white/65">Förstå idén först. Sedan testar vi om du kan använda den.</p></div></div>
                <button type="button" onClick={() => setSession((old) => old ? { ...old, reveal: true } : old)} className={`mt-7 flex min-h-[230px] w-full flex-col items-center justify-center rounded-[32px] border p-6 text-center transition-all ${session.reveal ? "border-emerald-300/25 bg-emerald-400/[.07]" : "border-white/12 bg-white/[.045] active:scale-[.99]"}`}>
                  {session.reveal ? <><Lightbulb className="h-9 w-9 text-amber-200" /><p className="mt-5 text-[22px] font-semibold leading-snug text-white/94">{knowledgeForLesson(selected.id)?.core ?? selected.coach}</p><div className="mt-5 h-px w-16 bg-white/10" /><p className="mt-4 text-sm leading-relaxed text-white/55"><span className="font-bold text-amber-100">Varför?</span> {knowledgeForLesson(selected.id)?.why ?? selected.description}</p></> : <><Eye className="h-9 w-9 text-white/55" /><p className="mt-4 font-display text-2xl">Tryck för att avslöja nyckeln</p><p className="mt-2 max-w-[25ch] text-sm leading-relaxed text-white/45">Försök först själv formulera vad “{selected.title}” betyder.</p></>}
                </button>
                <div className="mt-auto pt-6"><button type="button" disabled={!session.reveal} onClick={continueSession} className={`flex w-full items-center justify-center gap-2 rounded-2xl py-4 font-display text-xl transition ${session.reveal ? "bg-emerald-400 text-slate-950" : "bg-white/[.06] text-white/25"}`}>Kolla om det sitter <Brain className="h-5 w-5" /></button></div>
              </div>
            ) : session.mode === "lesson" && session.phase === "finish" ? (
              <div className="flex flex-1 flex-col justify-center py-8 text-center">
                <div className="mx-auto flex h-20 w-20 items-center justify-center rounded-full border border-emerald-300/30 bg-emerald-400/12"><Check className="h-9 w-9 text-emerald-300" /></div>
                <p className="mt-5 text-[10px] font-black uppercase tracking-[.2em] text-emerald-300">Lektionen sitter</p>
                <h2 className="mt-2 font-display text-4xl">{selected.title}</h2>
                <div className="mt-7 text-left"><div className="flex gap-3 rounded-[26px] border border-white/10 bg-white/[.045] p-5"><MessageCircle className="mt-0.5 h-5 w-5 shrink-0 text-emerald-300" /><div><p className="text-[10px] font-black uppercase tracking-[.16em] text-white/35">Ta med till banan</p><p className="mt-2 text-[16px] leading-relaxed text-white/80">{knowledgeForLesson(selected.id)?.why ?? selected.description}</p></div></div></div>
                <p className="mt-5 text-sm text-white/45">{session.correct}/{session.questions.length} rätt · Det du missade kommer tillbaka i repetition senare.</p>
                <button type="button" onClick={continueSession} className="mt-7 rounded-2xl bg-emerald-400 py-4 font-display text-xl text-slate-950">Fortsätt på vägen <ChevronRight className="ml-1 inline h-5 w-5" /></button>
              </div>
            ) : (() => {
              const question = session.questions[session.index];
              const answered = session.selected !== undefined;
              return <div className="flex flex-1 flex-col py-6">
                {session.mode === "lesson" ? <div className="mb-5 flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-emerald-300/25 bg-emerald-400/10"><span className="text-xl">🧑🏻‍🏫</span></div><div className="rounded-[20px] border border-white/10 bg-white/[.045] px-4 py-3 text-sm leading-relaxed text-white/70">{question.level === "recall" ? "Nu tar vi bort stödet. Kan du plocka fram det själv?" : question.level === "understand" ? "Bra. Nu vill jag se om du verkligen förstår varför." : "Sista steget: använd kunskapen i en riktig golfsituation."}</div></div> : null}
                <div className="mb-5 flex items-center gap-2">{session.questions.map((_, i) => <span key={i} className={`h-1.5 flex-1 rounded-full ${i <= session.index ? "bg-emerald-400" : "bg-white/10"}`} />)}</div>
                <p className="text-[10px] font-black uppercase tracking-[.18em] text-white/40">{question.level === "recall" ? "Återkalla" : question.level === "understand" ? "Förstå" : "Tillämpa"}</p>
                <h2 className="mt-3 font-display text-[30px] leading-[1.08]">{question.prompt}</h2>
                <div className="mt-6 space-y-3">{question.options.map((option, i) => { const chosen = session.selected === i; const correct = answered && i === question.correct; const wrong = answered && chosen && i !== question.correct; return <button key={option} type="button" disabled={answered} onClick={() => answerQuestion(i)} className={`w-full rounded-[22px] border px-4 py-4 text-left text-[15px] font-semibold transition ${correct ? "border-emerald-300/60 bg-emerald-400/15 text-emerald-50" : wrong ? "border-red-300/50 bg-red-400/12 text-red-50" : "border-white/12 bg-white/[.055] text-white/88 active:scale-[.99]"}`}><span className="mr-3 inline-flex h-7 w-7 items-center justify-center rounded-full border border-white/10 bg-white/[.05] text-xs text-white/55">{String.fromCharCode(65+i)}</span>{option}</button>; })}</div>
                {answered ? <div className={`mt-5 flex gap-3 rounded-[22px] border p-4 ${session.selected === question.correct ? "border-emerald-300/25 bg-emerald-400/[.08]" : "border-amber-300/25 bg-amber-300/[.07]"}`}><div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/[.06]"><span className="text-lg">🧑🏻‍🏫</span></div><div><p className={`text-xs font-black uppercase tracking-[.14em] ${session.selected === question.correct ? "text-emerald-300" : "text-amber-200"}`}>{session.selected === question.correct ? "Precis" : "Inte riktigt"}</p><p className="mt-1 text-sm leading-relaxed text-white/78">{question.feedback}</p></div></div> : null}
                <div className="mt-auto pt-6">{answered ? <button type="button" onClick={continueSession} className="w-full rounded-2xl bg-emerald-400 py-4 font-display text-xl text-slate-950">{session.index + 1 < session.questions.length ? "Nästa" : session.mode === "lesson" ? "Sammanfatta" : "Visa resultat"}</button> : null}</div>
              </div>;
            })()}
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/learn.tsx
          git commit -m "Make Learn lessons coach-led and interactive"
          git push
