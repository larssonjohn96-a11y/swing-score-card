name: Fix bot selector sticky CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_bot_selector_sticky.py'
      - '.github/workflows/fix-bot-selector-sticky.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_bot_selector_sticky.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Keep bot play CTA fixed and remove flags"
          git push
