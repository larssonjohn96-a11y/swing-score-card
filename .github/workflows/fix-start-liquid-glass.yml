name: Fix liquid glass start buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-start-liquid-glass.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Start buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          old = 'className="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 via-slate-900 to-red-600 py-4 font-display text-xl text-white"'
          new = 'className="relative mt-6 flex w-full items-center justify-center gap-2 overflow-hidden rounded-2xl border border-white/80 bg-[linear-gradient(90deg,rgba(254,226,226,.94)_0%,rgba(255,255,255,.88)_50%,rgba(219,234,254,.94)_100%)] py-4 font-display text-xl text-slate-900 shadow-[inset_0_1px_0_rgba(255,255,255,.98),0_14px_34px_-22px_rgba(148,163,184,.65)] backdrop-blur-xl transition active:scale-[.985]"'
          count = s.count(old)
          if count == 0:
              raise SystemExit('No Start button class found')
          s = s.replace(old, new)
          p.write_text(s)
          print('Updated', count, 'Start button(s)')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/match.tsx
          git commit -m 'Restyle match start buttons with liquid glass'
          git push
