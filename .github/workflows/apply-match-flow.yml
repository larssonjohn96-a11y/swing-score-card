name: Apply match flow patch

on:
  push:
    paths:
      - .github/workflows/apply-match-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/patch-match-flow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate friend and team match flows"
          git push origin HEAD:main
