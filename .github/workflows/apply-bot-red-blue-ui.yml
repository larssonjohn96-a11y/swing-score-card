name: Apply bot red-blue match UI

"on":
  push:
    paths:
      - .github/workflows/apply-bot-red-blue-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bot match UI
        run: python scripts/apply_bot_red_blue_match_ui.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run src/lib/sg4-engine.test.ts src/lib/sg4-recommender.test.ts

      - name: Verify old green bot match identity is gone
        run: |
          if grep -n "emerald-" src/routes/match-bot.tsx; then
            echo "Old emerald bot UI remains"
            exit 1
          fi

      - name: Commit bot match redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match-bot.tsx
          git commit -m "Align bot matches with red-blue Match Play design"
          git push origin main
