name: Lock match back navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-match-back-navigation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Patch match history navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Real friend/team match: mirror every internal step into browser history.
          # This makes system/browser Back move to the previous match step instead of leaving /match.
          p = Path('src/routes/match.tsx')
          s = p.read_text()
          anchor = '  const [localMatchReady, setLocalMatchReady] = useState(false);\n\n'
          block = '''  const [localMatchReady, setLocalMatchReady] = useState(false);\n\n  useEffect(() => {\n    const currentState = window.history.state ?? {};\n    if (currentState.sg4MatchStep === step) return;\n    const nextState = { ...currentState, sg4MatchStep: step };\n    if (step === "players") window.history.replaceState(nextState, "", window.location.href);\n    else window.history.pushState(nextState, "", window.location.href);\n  }, [step]);\n\n  useEffect(() => {\n    const onPopState = (event: PopStateEvent) => {\n      const target = event.state?.sg4MatchStep as Step | undefined;\n      if (target) setStep(target);\n    };\n    window.addEventListener("popstate", onPopState);\n    return () => window.removeEventListener("popstate", onPopState);\n  }, []);\n\n'''
          if 'sg4MatchStep' not in s:
              if anchor not in s: raise SystemExit('match history anchor missing')
              s = s.replace(anchor, block)

          old_back_start = '''  function back() {\n    if (step === "teams") setStep("players");\n    else if (step === "scoring") setStep("type");\n    else if (step === "category") setStep(mode === "singles" ? "players" : "teams");\n    else if (step === "type") setStep("category");\n    else if (step === "setup") setStep("category");\n    else if (step === "approach-setup") setStep("category");\n    else if (step === "length") setStep(isApproach ? "approach-setup" : category === "off-the-tee" || isPutting || isShortGameScoring ? "category" : "scoring");\n  }\n'''
          new_back = '''  function back() {\n    if (step === "players") return;\n    window.history.back();\n  }\n'''
          if old_back_start in s:
              s = s.replace(old_back_start, new_back)
          p.write_text(s)

          # Bot match: same rule. Only the bot picker is allowed to leave the match flow with Back.
          p = Path('src/routes/match-bot.tsx')
          s = p.read_text()
          anchor = '  const [winnerCelebration, setWinnerCelebration] = useState<"you" | "bot" | null>(null);\n\n'
          block = '''  const [winnerCelebration, setWinnerCelebration] = useState<"you" | "bot" | null>(null);\n\n  useEffect(() => {\n    if (cupContext) return;\n    const currentState = window.history.state ?? {};\n    if (currentState.sg4BotMatchStep === step) return;\n    const nextState = { ...currentState, sg4BotMatchStep: step };\n    if (step === "bot") window.history.replaceState(nextState, "", window.location.href);\n    else window.history.pushState(nextState, "", window.location.href);\n  }, [step, cupContext]);\n\n  useEffect(() => {\n    if (cupContext) return;\n    const onPopState = (event: PopStateEvent) => {\n      const target = event.state?.sg4BotMatchStep as Step | undefined;\n      if (target) setStep(target);\n    };\n    window.addEventListener("popstate", onPopState);\n    return () => window.removeEventListener("popstate", onPopState);\n  }, [cupContext]);\n\n'''
          if 'sg4BotMatchStep' not in s:
              if anchor not in s: raise SystemExit('bot history anchor missing')
              s = s.replace(anchor, block)

          old = '''  function back() {\n    if (cupContext) { window.location.assign("/cup"); return; }\n    if (step === "category") setStep("bot");\n    else if (step === "setup") setStep("category");\n    else if (step === "length") setStep(category === "around-the-green" || category === "bunker" ? "setup" : "category");\n  }\n'''
          new = '''  function back() {\n    if (cupContext) { window.location.assign("/cup"); return; }\n    if (step === "bot") return;\n    window.history.back();\n  }\n'''
          if old in s:
              s = s.replace(old, new)
          else:
              raise SystemExit('bot back function not found')

          # The only visible Back exit on the bot picker should return to the Play hub, like friend match.
          s = s.replace('<Link to="/" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-xl ${glass}`}>‹</Link>', '<Link to="/spela" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-xl ${glass}`}>‹</Link>', 1)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/match.tsx src/routes/match-bot.tsx
          git commit -m "Keep back navigation inside match flows"
          git push
