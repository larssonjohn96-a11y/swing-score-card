name: Fix remaining match lengths

on:
  push:
    paths:
      - .github/workflows/fix-match-lengths.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch match length UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/match.tsx')
          t = p.read_text()
          old = '''{isPgaPutting ? <p className="mt-2 text-sm text-slate-600">Välj 5, 9 eller 18 hål. Alla längder får en mix av korta, mellanlånga och långa PGA Tour-avstånd.</p> : null}</section><div className="mt-5 grid grid-cols-3 gap-3">{([5, 9, 18] as const).map((v) => <button key={v} onClick={() => setMatchLength(v)} className={`relative rounded-3xl border px-3 py-6 ${matchLength === v ? selectedRing : glass}`}>{matchLength === v ? <SelectedCheck className="absolute right-1.5 top-1.5" /> : null}<span className="block whitespace-nowrap font-display text-3xl leading-none">{v} <span className="text-xl">hål</span></span><span className="mt-2 block text-[9px] font-bold uppercase tracking-[0.12em] text-slate-500">{isPgaPutting ? (v === 5 ? "Snabb" : v === 9 ? "Halv match" : "Full match") : v === 5 ? "Snabb" : v === 9 ? "Halv match" : "Full match"}</span></button>)}</div>'''
          new = '''{isPgaPutting ? <p className="mt-2 text-sm text-slate-600">Välj 3, 5 eller 7 hål. Alla längder får en mix av korta, mellanlånga och långa PGA Tour-avstånd.</p> : null}</section><div className="mt-5 grid grid-cols-3 gap-3">{([3, 5, 7] as const).map((v) => <button key={v} onClick={() => setMatchLength(v)} className={`relative rounded-3xl border px-3 py-6 ${matchLength === v ? selectedRing : glass}`}>{matchLength === v ? <SelectedCheck className="absolute right-1.5 top-1.5" /> : null}<span className="block whitespace-nowrap font-display text-3xl leading-none">{v} <span className="text-xl">hål</span></span><span className="mt-2 block text-[9px] font-bold uppercase tracking-[0.12em] text-slate-500">{v === 3 ? "Snabb" : v === 5 ? "Standard" : "Lång"}</span></button>)}</div>'''
          if old not in t:
              raise SystemExit('old match length UI not found')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx
          git commit -m "Finish 3 5 7 match length UI"
          git push origin HEAD:main
