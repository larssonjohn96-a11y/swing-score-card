name: Add engagement fun brain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-engagement-fun-brain.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Add engagement and fun policy and wire it into SG4
        run: |
          cat > src/lib/engagement-fun-policy.ts <<'EOF'
          /**
           * SG4 engagement/fun policy.
           *
           * Evidence-informed product policy, not scientific constants. The numeric
           * weights are tuning defaults and should be calibrated with SG4 retention,
           * completion, replay and transfer data through controlled experiments.
           *
           * Product principles:
           * - engagement must reinforce useful play/training, not empty time spent
           * - autonomy, competence and relatedness are durable motivation levers
           * - balance familiarity with discovery so the experience stays fresh
           * - visible progress, milestones and celebrations strengthen competence
           * - social loops work best when they are relevant, opt-in and appropriately matched
           * - habit loops should have a very easy minimum action and forgiving recovery
           * - reduce interaction friction and waiting; speed is part of engagement
           * - avoid recommendation echo chambers by deliberately preserving exploration
           * - prefer repeatable return quality over binge-length sessions
           * - test product changes against retention and successful activity completion,
           *   not clicks alone
           */

          export type EngagementStage = "new" | "habit" | "established" | "deep-session" | "returning";

          export const ENGAGEMENT_FUN_PRINCIPLES = [
            "Optimize long-term return and useful completed activity, not raw taps or time spent.",
            "Support autonomy with meaningful choice and personalization instead of forcing one path.",
            "Support competence with achievable challenge, visible progress, milestones and clear feedback.",
            "Support relatedness with friends, teams, shared goals and appropriately matched competition.",
            "Mix familiar favorites with deliberate discovery so recommendations do not become repetitive.",
            "Make the minimum useful daily action easy enough to start, then let users voluntarily continue.",
            "Use forgiving recovery after a missed day instead of turning one lapse into abandonment.",
            "Celebrate personal bests, streak milestones, wins and progress without making rewards the whole product.",
            "Reduce load time, waiting and unnecessary taps because friction directly competes with motivation.",
            "Treat deep sessions differently: preserve quality and end on a satisfying win rather than maximizing grind.",
            "A/B test major engagement mechanics and keep learning/skill outcomes as guardrail metrics.",
          ] as const;

          const clamp = (value: number, min = 0, max = 1) => Math.min(max, Math.max(min, value));

          export function engagementStageFromSignals(input: {
            sessionDepth: number;
            completions: number;
            hoursSinceLastCompletion: number;
          }): EngagementStage {
            if (Number.isFinite(input.hoursSinceLastCompletion) && input.hoursSinceLastCompletion >= 96) return "returning";
            if (input.sessionDepth >= 12) return "deep-session";
            if (input.completions < 2) return "new";
            if (input.completions < 8) return "habit";
            return "established";
          }

          export function noveltyTargetForStage(stage: EngagementStage) {
            if (stage === "new") return 0.62;
            if (stage === "habit") return 0.5;
            if (stage === "established") return 0.42;
            if (stage === "returning") return 0.48;
            return 0.32;
          }

          /**
           * A repeated recommendation can still be useful, but repeated identical
           * suggestions should lose value quickly enough to keep discovery alive.
           */
          export function repetitionDiversityScore(recentMatches: number) {
            if (recentMatches <= 0) return 1;
            if (recentMatches === 1) return 0.82;
            if (recentMatches === 2) return 0.58;
            if (recentMatches === 3) return 0.38;
            return 0.24;
          }

          /**
           * Completion is used as a lightweight competence proxy. Very low completion
           * suggests frustration; extremely high completion can indicate an activity
           * has become automatic and may need novelty/challenge rather than endless repeat.
           */
          export function competenceFit(completionRate: number) {
            const c = clamp(completionRate);
            if (c < 0.25) return clamp(c / 0.25 * 0.45, 0.08, 0.45);
            if (c <= 0.82) return clamp(0.45 + (c - 0.25) / 0.57 * 0.55, 0.45, 1);
            return clamp(1 - (c - 0.82) * 0.45, 0.88, 1);
          }

          /**
           * A practical engagement score for the current recommender signals. Autonomy
           * and relatedness should be supplied by explicit feature metadata later; we do
           * not infer those psychological states from clicks.
           */
          export function engagementFunScore(input: {
            affinity: number;
            novelty: number;
            exploration: number;
            spacing: number;
            completionRate: number;
            recentMatches: number;
            sessionDepth: number;
            hoursSinceLastCompletion: number;
            completions?: number;
          }) {
            const stage = engagementStageFromSignals({
              sessionDepth: input.sessionDepth,
              completions: input.completions ?? 0,
              hoursSinceLastCompletion: input.hoursSinceLastCompletion,
            });
            const noveltyTarget = noveltyTargetForStage(stage);
            const noveltyFit = clamp(1 - Math.abs(clamp(input.novelty) - noveltyTarget) / 0.75, 0.18, 1);
            const competence = competenceFit(input.completionRate);
            const diversity = repetitionDiversityScore(input.recentMatches);
            const affinity = clamp(input.affinity);
            const exploration = clamp(input.exploration);
            const spacing = clamp(input.spacing);

            // Deep sessions shift toward familiar, completable experiences instead of
            // escalating novelty forever. Returning users get a gentle competence boost.
            const deepSession = stage === "deep-session";
            const returning = stage === "returning";
            const score = deepSession
              ? affinity * 0.31 + competence * 0.25 + noveltyFit * 0.11 + exploration * 0.07 + spacing * 0.11 + diversity * 0.15
              : returning
                ? affinity * 0.24 + competence * 0.23 + noveltyFit * 0.15 + exploration * 0.1 + spacing * 0.16 + diversity * 0.12
                : affinity * 0.26 + competence * 0.2 + noveltyFit * 0.18 + exploration * 0.11 + spacing * 0.11 + diversity * 0.14;

            return {
              score: clamp(score),
              stage,
              noveltyFit,
              competence,
              diversity,
            } as const;
          }

          /**
           * If SG4 adds a visible streak, use grace rather than a hard all-or-nothing
           * reset as the default recovery model.
           */
          export function habitRecoveryPolicy(daysSinceUsefulActivity: number) {
            if (daysSinceUsefulActivity <= 1) return { state: "active", preserveMomentum: true, reentryIntensity: 0.7 } as const;
            if (daysSinceUsefulActivity <= 3) return { state: "grace", preserveMomentum: true, reentryIntensity: 0.45 } as const;
            if (daysSinceUsefulActivity <= 7) return { state: "returning", preserveMomentum: false, reentryIntensity: 0.32 } as const;
            return { state: "restart", preserveMomentum: false, reentryIntensity: 0.22 } as const;
          }

          export function frictionQualityScore(input: { expectedWaitMs?: number; interactionSteps?: number }) {
            const wait = Math.max(0, input.expectedWaitMs ?? 0);
            const steps = Math.max(0, input.interactionSteps ?? 0);
            const waitScore = clamp(1 - wait / 5000, 0.15, 1);
            const stepScore = clamp(1 - Math.max(0, steps - 1) * 0.08, 0.3, 1);
            return clamp(waitScore * 0.62 + stepScore * 0.38);
          }
          EOF

          cat > src/lib/engagement-fun-policy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import {
            competenceFit,
            engagementFunScore,
            engagementStageFromSignals,
            frictionQualityScore,
            habitRecoveryPolicy,
            repetitionDiversityScore,
          } from "@/lib/engagement-fun-policy";

          describe("engagement fun policy", () => {
            it("treats long sessions differently", () => {
              expect(engagementStageFromSignals({ sessionDepth: 14, completions: 10, hoursSinceLastCompletion: 1 })).toBe("deep-session");
            });

            it("recognizes returning users", () => {
              expect(engagementStageFromSignals({ sessionDepth: 0, completions: 10, hoursSinceLastCompletion: 120 })).toBe("returning");
            });

            it("penalizes repetitive recommendations", () => {
              expect(repetitionDiversityScore(3)).toBeLessThan(repetitionDiversityScore(0));
            });

            it("prefers competent but not necessarily trivial completion", () => {
              expect(competenceFit(0.7)).toBeGreaterThan(competenceFit(0.1));
            });

            it("uses forgiving habit recovery for short lapses", () => {
              expect(habitRecoveryPolicy(2).state).toBe("grace");
              expect(habitRecoveryPolicy(2).preserveMomentum).toBe(true);
            });

            it("scores lower friction higher", () => {
              expect(frictionQualityScore({ expectedWaitMs: 200, interactionSteps: 1 }))
                .toBeGreaterThan(frictionQualityScore({ expectedWaitMs: 4000, interactionSteps: 5 }));
            });

            it("repetition lowers otherwise identical engagement value", () => {
              const base = {
                affinity: 0.72,
                novelty: 0.55,
                exploration: 0.4,
                spacing: 0.7,
                completionRate: 0.72,
                sessionDepth: 4,
                hoursSinceLastCompletion: 30,
                completions: 5,
              };
              expect(engagementFunScore({ ...base, recentMatches: 0 }).score)
                .toBeGreaterThan(engagementFunScore({ ...base, recentMatches: 3 }).score);
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          # Wire the policy into the behavior recommender.
          p = Path('src/lib/sg4-recommender.ts')
          s = p.read_text()
          imp = 'import { engagementFunScore } from "@/lib/engagement-fun-policy";\n'
          if imp not in s:
            s = imp + s

          type_anchor = '  spacing: number;\n  completionRate: number;'
          if type_anchor not in s:
            raise SystemExit('BehaviorRecommendationScore anchor missing')
          s = s.replace(type_anchor, '  spacing: number;\n  engagementFit: number;\n  completionRate: number;', 1)

          sig_old = '''export function scoreBehaviorProfile(
            profile: ActivityBehaviorProfile,
            recentMatches = 0,
          ): BehaviorRecommendationScore {'''
          sig_new = '''export function scoreBehaviorProfile(
            profile: ActivityBehaviorProfile,
            recentMatches = 0,
            sessionDepth = 0,
          ): BehaviorRecommendationScore {'''
          if sig_old not in s:
            raise SystemExit('scoreBehaviorProfile signature anchor missing')
          s = s.replace(sig_old, sig_new, 1)

          novelty_anchor = '  const novelty = clamp((1 - recentMatches * 0.24) * (0.7 + spacing * 0.3), 0.1, 1);\n'
          if novelty_anchor not in s:
            raise SystemExit('novelty anchor missing')
          engagement_block = '''  const engagement = engagementFunScore({
            affinity,
            novelty,
            exploration,
            spacing,
            completionRate: clamp(smoothedCompletionRate),
            recentMatches,
            sessionDepth,
            hoursSinceLastCompletion: recentCompletionHours,
            completions: profile.completions,
          });
          '''
          if engagement_block not in s:
            s = s.replace(novelty_anchor, novelty_anchor + '\n' + engagement_block, 1)

          fn_start = s.index('export function scoreBehaviorProfile')
          return_start = s.index('  return {', fn_start)
          return_end = s.index('  };', return_start) + len('  };')
          return_block = '''  return {
            // The behavior model is now constrained by an explicit engagement/fun
            // policy so affinity cannot turn the feed into a replay echo chamber.
            score: engagement.score,
            affinity,
            novelty,
            exploration,
            spacing,
            engagementFit: engagement.noveltyFit * 0.35 + engagement.competence * 0.35 + engagement.diversity * 0.3,
            completionRate: clamp(smoothedCompletionRate),
          };'''
          s = s[:return_start] + return_block + s[return_end:]

          call_old = '  return scoreBehaviorProfile(profile, recentMatches);'
          call_new = '  return scoreBehaviorProfile(profile, recentMatches, model.sessionEvents);'
          if call_old not in s:
            raise SystemExit('getBehaviorRecommendationScore call anchor missing')
          s = s.replace(call_old, call_new, 1)
          p.write_text(s)

          # Give the combined engine direct access to the new engagement score and spacing.
          p = Path('src/lib/sg4-engine.ts')
          s = p.read_text()
          old_fun = '''      const funScore =
                behavior.affinity * 0.44 +
                behavior.novelty * 0.18 +
                behavior.exploration * 0.18 +
                affinity * 0.15 +
                dayVariation * 0.05;'''
          new_fun = '''      const funScore =
                behavior.score * 0.34 +
                behavior.affinity * 0.22 +
                behavior.novelty * 0.1 +
                behavior.exploration * 0.08 +
                behavior.spacing * 0.08 +
                behavior.engagementFit * 0.08 +
                affinity * 0.07 +
                dayVariation * 0.03;'''
          if old_fun not in s:
            raise SystemExit('funScore anchor missing')
          s = s.replace(old_fun, new_fun, 1)

          old_learning = '''      const learningScore =
                learningNeed * 0.62 +
                behavior.exploration * 0.16 +
                behavior.completionRate * 0.1 +
                behavior.novelty * 0.08 +
                dayVariation * 0.04;'''
          new_learning = '''      const learningScore =
                learningNeed * 0.52 +
                behavior.spacing * 0.14 +
                behavior.exploration * 0.1 +
                behavior.completionRate * 0.08 +
                behavior.novelty * 0.05 +
                behavior.engagementFit * 0.05 +
                behavior.score * 0.03 +
                dayVariation * 0.03;'''
          if old_learning not in s:
            raise SystemExit('learningScore anchor missing')
          s = s.replace(old_learning, new_learning, 1)
          p.write_text(s)
          PY

          bun install --frozen-lockfile
          bunx vitest run src/lib/engagement-fun-policy.test.ts src/lib/motor-learning-policy.test.ts src/lib/bot-skill-model.test.ts src/lib/bot-match-pressure.test.ts --passWithNoTests
          bun run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/engagement-fun-policy.ts src/lib/engagement-fun-policy.test.ts src/lib/sg4-recommender.ts src/lib/sg4-engine.ts
          git commit -m "Teach SG4 brain engagement and fun principles"
          git push