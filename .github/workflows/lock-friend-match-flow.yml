name: Lock friend match flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lock-friend-match-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Implement strict friend match navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Most-played opponent helper
          p = Path('src/lib/friend-match-experience.ts')
          s = p.read_text()
          anchor = '''export function getFriendHeadToHead(selfKey: string, opponentKey: string) {\n  return summarizeFriendHeadToHead(readHistory(), selfKey, opponentKey);\n}\n'''
          insert = anchor + '''\nexport function getMostPlayedOpponentKey(selfKey: string) {\n  const relevant = readHistory().filter((entry) => entry.selfKey === selfKey && entry.opponentKey);\n  if (!relevant.length) return null;\n  const summary = new Map<string, { count: number; latest: number }>();\n  for (const entry of relevant) {\n    const previous = summary.get(entry.opponentKey) ?? { count: 0, latest: 0 };\n    summary.set(entry.opponentKey, {\n      count: previous.count + 1,\n      latest: Math.max(previous.latest, Date.parse(entry.playedAt) || 0),\n    });\n  }\n  return [...summary.entries()].sort((a, b) => b[1].count - a[1].count || b[1].latest - a[1].latest)[0]?.[0] ?? null;\n}\n'''
          if anchor not in s: raise SystemExit('friend helper anchor missing')
          p.write_text(s.replace(anchor, insert))

          p = Path('src/routes/match.tsx')
          s = p.read_text()

          s = s.replace('''import { Check, ChevronRight, Loader2, Flag, Minus, Plus, RotateCcw, Target, Trophy, User, Users, X } from "lucide-react";''', '''import { Check, ChevronRight, Loader2, Flag, Home, Minus, Plus, RotateCcw, Target, Trophy, User, Users, X } from "lucide-react";''')
          s = s.replace('''import { allowedDistancesInsideBand, getFriendHeadToHead, getFriendMatchPacing, getPlannedDistanceBand, recordFriendMatchHistory } from "@/lib/friend-match-experience";''', '''import { allowedDistancesInsideBand, getFriendHeadToHead, getFriendMatchPacing, getMostPlayedOpponentKey, getPlannedDistanceBand, recordFriendMatchHistory } from "@/lib/friend-match-experience";''')

          # Add abort confirmation state.
          state_anchor = '''  const [pickerOpen, setPickerOpen] = useState(false);'''
          if state_anchor not in s: raise SystemExit('picker state missing')
          s = s.replace(state_anchor, state_anchor + '''\n  const [abortConfirmOpen, setAbortConfirmOpen] = useState(false);''')

          # Replace browser-history-driven setup navigation with explicit setup states,
          # while swallowing browser back during an active match.
          old_history = '''  useEffect(() => {\n    const currentState = window.history.state ?? {};\n    if (currentState.sg4MatchStep === step) return;\n    const nextState = { ...currentState, sg4MatchStep: step };\n    if (step === "players") window.history.replaceState(nextState, "", window.location.href);\n    else window.history.pushState(nextState, "", window.location.href);\n  }, [step]);\n\n  useEffect(() => {\n    const onPopState = (event: PopStateEvent) => {\n      const target = event.state?.sg4MatchStep as Step | undefined;\n      if (target) setStep(target);\n    };\n    window.addEventListener("popstate", onPopState);\n    return () => window.removeEventListener("popstate", onPopState);\n  }, []);\n'''
          new_history = '''  const liveStepRef = useRef<Step>(step);\n  useEffect(() => { liveStepRef.current = step; }, [step]);\n\n  useEffect(() => {\n    const currentState = window.history.state ?? {};\n    if (currentState.sg4MatchStep === step) return;\n    const nextState = { ...currentState, sg4MatchStep: step };\n    const live = step === "play" || step === "sudden-death" || step === "result";\n    if (step === "players" || live) window.history.replaceState(nextState, "", window.location.href);\n    else window.history.pushState(nextState, "", window.location.href);\n  }, [step]);\n\n  useEffect(() => {\n    const onPopState = (event: PopStateEvent) => {\n      const current = liveStepRef.current;\n      if (current === "play" || current === "sudden-death") {\n        window.history.pushState({ ...(window.history.state ?? {}), sg4MatchStep: current }, "", window.location.href);\n        return;\n      }\n      const target = event.state?.sg4MatchStep as Step | undefined;\n      if (target && current !== "result") setStep(target);\n    };\n    window.addEventListener("popstate", onPopState);\n    return () => window.removeEventListener("popstate", onPopState);\n  }, []);\n'''
          if old_history not in s: raise SystemExit('history block missing')
          s = s.replace(old_history, new_history)

          # Preselect the most-played accepted friend once social data has loaded.
          auto_anchor = '''  const selfHistoryKey = user?.id ?? `self:${selfName.toLowerCase()}`;\n  const opponentHistoryKey = friendOpponent?.id ?? (friendOpponent ? `guest:${friendOpponent.name.toLowerCase()}` : "");'''
          auto_insert = auto_anchor + '''\n\n  useEffect(() => {\n    if (entryFlow !== "friend" || step !== "players" || friendsLoading || selectedFriendIds.length || guests.length) return;\n    const mostPlayed = getMostPlayedOpponentKey(selfHistoryKey);\n    if (!mostPlayed || !friends.some((friend) => friend.other.id === mostPlayed)) return;\n    setSelectedFriendIds([mostPlayed]);\n  }, [entryFlow, step, friendsLoading, friends, selectedFriendIds.length, guests.length, selfHistoryKey]);'''
          if auto_anchor not in s: raise SystemExit('history key anchor missing')
          s = s.replace(auto_anchor, auto_insert)

          # Explicit back destinations. Hole-length always returns to category as requested.
          old_back = '''  function back() {\n    if (step === "players") return;\n    window.history.back();\n  }'''
          new_back = '''  function back() {\n    if (step === "players") return;\n    if (step === "teams") { goToStep("players"); return; }\n    if (step === "category") { goToStep(entryFlow === "friend" ? "players" : "teams"); return; }\n    if (step === "type" || step === "setup" || step === "approach-setup" || step === "scoring" || step === "length") { goToStep("category"); return; }\n  }\n\n  function abortMatch() {\n    setAbortConfirmOpen(false);\n    reset();\n  }'''
          if old_back not in s: raise SystemExit('back function missing')
          s = s.replace(old_back, new_back)

          # Remove setup X entirely. Only the left back arrow remains.
          old_header = '''{step !== "play" && step !== "sudden-death" && step !== "result" ? <header className="flex items-center justify-between">{step === "players" ? <Link to="/spela" aria-label="Tillbaka" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-2xl leading-none ${glass}`}>‹</Link> : <button onClick={back} aria-label="Föregående steg" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-2xl leading-none ${glass}`}>‹</button>}<div className="text-center"><p className="text-[9px] font-bold uppercase tracking-[0.22em] text-slate-500">SG4 Match</p><p className="text-[11px] font-semibold text-slate-700">{stepLabel}</p></div>{step === "players" ? <span aria-hidden="true" className="h-10 w-10" /> : <Link to="/" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border ${glass}`}>×</Link>}</header> : null}'''
          new_header = '''{step !== "play" && step !== "sudden-death" && step !== "result" ? <header className="flex items-center justify-between">{step === "players" ? <Link to="/spela" aria-label="Tillbaka till Spela" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-2xl leading-none ${glass}`}>‹</Link> : <button onClick={back} aria-label="Föregående steg" className={`inline-flex h-10 w-10 items-center justify-center rounded-full border text-2xl leading-none ${glass}`}>‹</button>}<div className="text-center"><p className="text-[9px] font-bold uppercase tracking-[0.22em] text-slate-500">SG4 Match</p><p className="text-[11px] font-semibold text-slate-700">{stepLabel}</p></div><span aria-hidden="true" className="h-10 w-10" /></header> : null}'''
          if old_header not in s: raise SystemExit('setup header missing')
          s = s.replace(old_header, new_header)

          # On-match header: no back arrow or home escape. Abort is the only exit.
          old_play_header = '''{step === "play" && current ? <><header className="relative flex h-9 items-center justify-center"><Link to="/" aria-label="Till startsidan" className={`absolute left-0 top-0 inline-flex h-9 w-9 items-center justify-center rounded-full border text-xl leading-none ${glass}`}>‹</Link><p className="text-[9px] font-bold uppercase tracking-[0.18em] text-slate-500">{scoringMode === "match" ? "Match Play" : "Slagspel"} · {selectedCategory?.title}</p>{editingHoleIndex !== null ? <div className="absolute right-0 top-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-[8px] font-bold text-amber-700">Redigerar</div> : null}</header>'''
          new_play_header = '''{step === "play" && current ? <><header className="relative flex h-9 items-center justify-center"><p className="text-[9px] font-bold uppercase tracking-[0.18em] text-slate-500">{scoringMode === "match" ? "Match Play" : "Slagspel"} · {selectedCategory?.title}</p>{editingHoleIndex !== null ? <div className="absolute left-0 top-1 rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-[8px] font-bold text-amber-700">Redigerar</div> : null}</header>'''
          if old_play_header not in s: raise SystemExit('play header missing')
          s = s.replace(old_play_header, new_play_header)

          # Global active-match abort control, including sudden death.
          main_anchor = '''    {step !== "play" && step !== "sudden-death" && step !== "result" ? <style>{`'''
          abort_control = '''    {(step === "play" || step === "sudden-death") ? <button type="button" onClick={() => setAbortConfirmOpen(true)} className="fixed right-4 top-[max(10px,env(safe-area-inset-top))] z-[45] rounded-full border border-red-200/90 bg-white/92 px-3 py-2 text-[10px] font-black uppercase tracking-[0.08em] text-red-700 shadow-sm backdrop-blur-xl">Avbryt spel</button> : null}\n\n'''
          if main_anchor not in s: raise SystemExit('main style anchor missing')
          s = s.replace(main_anchor, abort_control + main_anchor)

          # Result exits: rematch, another category (keep opponent), or Home -> first match page.
          old_actions = '''<section className="mt-5 space-y-3"><button onClick={rematch} className="flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-4 font-display text-xl text-white"><RotateCcw className="h-5 w-5" /> Rematch</button><button onClick={newCompetition} className={`flex w-full items-center justify-center gap-2 rounded-2xl border py-4 font-display text-xl text-slate-900 ${glass}`}><Trophy className="h-5 w-5" /> Annan kategori</button></section>'''
          new_actions = '''<section className="mt-5 space-y-3"><button onClick={rematch} className="flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-950 py-4 font-display text-xl text-white"><RotateCcw className="h-5 w-5" /> Rematch</button><button onClick={newCompetition} className={`flex w-full items-center justify-center gap-2 rounded-2xl border py-4 font-display text-xl text-slate-900 ${glass}`}><Trophy className="h-5 w-5" /> Match i annan kategori</button><button onClick={reset} className={`flex w-full items-center justify-center gap-2 rounded-2xl border py-4 font-display text-xl text-slate-900 ${glass}`}><Home className="h-5 w-5" /> Hem</button></section>'''
          if old_actions not in s: raise SystemExit('result actions missing')
          s = s.replace(old_actions, new_actions)

          # Confirmation modal immediately before the friend picker sheet.
          sheet_anchor = '''    <Sheet open={pickerOpen} onOpenChange={setPickerOpen}>'''
          modal = '''    {abortConfirmOpen ? <div className="fixed inset-0 z-[190] flex items-center justify-center bg-slate-950/45 px-5 backdrop-blur-sm"><div className="w-full max-w-sm rounded-[28px] border border-slate-200 bg-white p-5 shadow-2xl"><p className="font-display text-3xl leading-none text-slate-950">Avbryt spelet?</p><p className="mt-3 text-sm leading-relaxed text-slate-600">Är du säker på att du vill avbryta spelet? Det går inte att komma tillbaka till den här matchen.</p><div className="mt-5 space-y-2.5"><button type="button" onClick={() => setAbortConfirmOpen(false)} className="w-full rounded-2xl bg-slate-950 py-3.5 text-sm font-bold text-white">Fortsätt spela</button><button type="button" onClick={abortMatch} className="w-full rounded-2xl border border-red-200 bg-red-50 py-3.5 text-sm font-bold text-red-700">Avbryt spel</button></div></div></div> : null}\n\n'''
          if sheet_anchor not in s: raise SystemExit('sheet anchor missing')
          s = s.replace(sheet_anchor, modal + sheet_anchor)

          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/match.tsx src/lib/friend-match-experience.ts
          git commit -m "Lock friend match navigation and exits"
          git push
